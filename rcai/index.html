<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
          --v-black: #000;
          --v-gray: #666;
          --v-border: #333;
        }

        body {
          background: var(--v-black);
          color: white;
          font-family: 'Inter', system-ui, sans-serif;
        }

        .chat-card {
          border: 1px solid var(--v-border);
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.02);
          backdrop-filter: blur(10px);
          padding: 20px;
        }

/* Анимация мигающего курсора при генерации */
        .typing::after {
          content: '|';
          animation: blink 1s infinite;
        }

    @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }

/* Плавное появление сообщений */
        .message {
          animation: fadeIn 0.3s ease forwards;
          opacity: 0;
          transform: translateY(10px);
        }

        @keyframes fadeIn {
          to { opacity: 1; transform: translateY(0); }
        }

        /* Анимация появления */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }


        .container {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px; /* Немного расширил для удобства чтения кода */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .hidden { display: none !important; }
        h2 { margin-top: 0; font-weight: 600; margin-bottom: 10px; }
        p { font-size: 14px; color: #49454f; margin-bottom: 20px; }

        input {
            width: calc(100% - 24px);
            padding: 14px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.8);
            margin-bottom: 12px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--m3-primary); }

        button {
            background: var(--m3-primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        #chat-log {
            text-align: left;
            height: 400px;
            overflow-y: auto;
            background: rgba(255,255,255,0.4);
            padding: 15px;
            border-radius: 16px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg { padding: 12px 16px; border-radius: 16px; max-width: 85%; font-size: 14.5px; line-height: 1.5; word-wrap: break-word; }
        .msg.user { background: var(--m3-primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.ai { background: white; color: #1c1b1f; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); width: 100%; box-sizing: border-box; }

        /* Стилизация ответов ИИ (Markdown) */
        .msg.ai p { margin: 0 0 10px 0; }
        .msg.ai p:last-child { margin: 0; }
        .msg.ai strong { font-weight: 600; color: #000; }
        .msg.ai pre {
            background: #0d1117; /* Темный фон для кода */
            color: #c9d1d9;
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .msg.ai pre code {
            font-family: var(--font-code);
            font-size: 13px;
            background: transparent;
            padding: 0;
        }
        .msg.ai code {
            font-family: var(--font-code);
            background: rgba(0,0,0,0.06);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 13.5px;
            color: #d63384; /* Цвет для инлайн-кода */
        }
        
        .error-box { color: #b3261e; background: #f9dedc; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
        .user-badge { font-size: 12px; color: var(--m3-primary); font-weight: 600; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="container fade-in" id="auth-section">
    <h2>Вход в систему</h2>
    <p>Только для пользователей <b>Plus ⭐️</b></p>
    <input type="text" id="tg-id" placeholder="Telegram ID (например: 123456)">
    <input type="password" id="tg-pass" placeholder="Пароль портала">
    <button onclick="login()">Подтвердить доступ</button>
    <div id="auth-error" class="error-box hidden fade-in"></div>
</div>

<div class="container hidden" id="app-section">
    <span id="user-greeting" class="user-badge"></span>
    <h2 id="app-title">AI Assistant</h2>
    
    <div id="chat-log"></div>
    
    <div style="display: flex; gap: 8px;">
        <input type="text" id="ai-input" placeholder="Спросите что-нибудь или напишите код..." style="margin-bottom: 0;">
        <button onclick="askAI()" id="send-btn" style="width: auto; padding: 12px 20px;">➜</button>
    </div>
</div>

<script>
    // Настраиваем marked.js для поддержки переносов строк
    marked.use({ breaks: true });

    let currentUser = null;

    async function login() {
        const id = document.getElementById('tg-id').value.trim();
        const pass = document.getElementById('tg-pass').value.trim();
        const errorBox = document.getElementById('auth-error');
        const btn = document.querySelector('#auth-section button');

        if (!id || !pass) {
            showError("Введите ID и пароль");
            return;
        }

        btn.innerText = "Проверка...";
        btn.disabled = true;

        try {
            const response = await fetch(`https://orrcs.vercel.app/api/getUser?id=${id}&pass=${encodeURIComponent(pass)}`);
            const data = await response.json();

            if (data.exists && data.pass_correct) {
                // ПРОВЕРКА НА PLUS
                if (data.has_plus === true || data.has_plus === "true") {
                    currentUser = data;
                    enterApp();
                } else {
                    showError("В доступе отказано. У вас нет подписки Plus ⭐️");
                }
            } else if (data.exists && !data.pass_correct) {
                showError("Неверный пароль");
            } else {
                showError("Пользователь не найден");
            }
        } catch (err) {
            showError("Ошибка сервера или сети");
        } finally {
            btn.innerText = "Подтвердить доступ";
            btn.disabled = false;
        }
    }

    function showError(text) {
        const errorBox = document.getElementById('auth-error');
        errorBox.innerText = text;
        errorBox.classList.remove('hidden');
    }

    function enterApp() {
        document.getElementById('auth-section').classList.add('hidden');
        
        const appSection = document.getElementById('app-section');
        appSection.classList.remove('hidden');
        appSection.classList.add('fade-in'); // Запускаем анимацию появления чата

        const name = currentUser.first_name || currentUser.username || "Пользователь";
        document.getElementById('user-greeting').innerText = `${name} • Plus ⭐️`;
        
        appendMessage('ai', `Привет, **${name}**! Я готов к работе. Чем могу помочь сегодня?`);
    }

    async function askAI() {
        const input = document.getElementById('ai-input');
        const btn = document.getElementById('send-btn');
        const msg = input.value.trim();
        if (!msg) return;

        appendMessage('user', msg);
        input.value = '';
        btn.disabled = true;
        btn.style.opacity = '0.5';

        try {
            // Запрос к вашему API
            const res = await fetch(`https://orrcs.vercel.app/api/ai?token=rcai&role=user&msg=${encodeURIComponent(msg)}&model=default`);
            const data = await res.json();
            
            const reply = data.reply || data.response || "Нет ответа от AI";
            appendMessage('ai', reply);
        } catch (err) {
            appendMessage('ai', "**Ошибка соединения:** не удалось получить ответ от нейросети.");
        } finally {
            btn.disabled = false;
            btn.style.opacity = '1';
            input.focus();
        }
    }

    function appendMessage(role, text) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        div.className = `msg ${role} fade-in`; // Анимация на каждое сообщение

        if (role === 'ai') {
            // Конвертируем Markdown в HTML
            div.innerHTML = marked.parse(text);
            
            // Активируем подсветку синтаксиса для всех блоков кода в этом сообщении
            div.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        } else {
            // Для пользователя выводим текст как есть
            div.innerText = text;
        }

        log.appendChild(div);
        
        // Плавная прокрутка вниз
        log.scrollTo({
            top: log.scrollHeight,
            behavior: 'smooth'
        });
    }
    function typeEffect(element, text, speed = 30) {
      let i = 0;
      element.innerHTML = "";
      element.classList.add('typing');
      
      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, speed);
        } else {
          element.classList.remove('typing');
        }
      }
      type();
    }
    // Вход и отправка по Enter
    document.getElementById('tg-pass').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });
    document.getElementById('ai-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') askAI();
    });
</script>

</body>
</html>
