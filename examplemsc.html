<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Московское время</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        #time {
            font-size: 5rem;
            font-weight: bold;
            margin: 0;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .refresh-btn {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #764ba2;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .refresh-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Москва</h1>
        <p id="time">--:--</p>
        <p class="status" id="status">Загрузка данных...</p>
        <button class="refresh-btn" onclick="fetchTime()">Обновить</button>
    </div>

    <script>
        const apiUrl = 'https://rcatcloud2.vercel.app/api/IloveMoscowTime.js';

        async function fetchTime() {
            const timeDisplay = document.getElementById('time');
            const statusDisplay = document.getElementById('status');
            
            try {
                statusDisplay.textContent = 'Обновление...';
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Ошибка сети');
                
                const data = await response.json();
                
                // Плавное обновление текста
                timeDisplay.textContent = data.time;
                statusDisplay.textContent = 'Данные получены из API';
            } catch (error) {
                console.error('Ошибка:', error);
                statusDisplay.textContent = 'Не удалось загрузить время';
                timeDisplay.textContent = '??:??';
            }
        }

        // Запрашиваем время при загрузке страницы
        fetchTime();

        // Автоматическое обновление каждую минуту
        setInterval(fetchTime, 60000);
    </script>
</body>
</html>
