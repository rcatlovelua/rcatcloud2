<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCS Portal</title>

<style>
body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* контейнер */
.container {
    border: 1px solid #2c2c2c;
    border-radius: 24px;
    padding: 40px;
    width: 400px;
    text-align: center;
}

/* заголовок */
h1 {
    font-size: 32px;
    margin-bottom: 20px;
}

.rcs {
    color: white;
}

.portal {
    color: #8b5cf6;
}

/* плюс */
.plus {
    color: gold;
    font-size: 14px;
    margin-left: 6px;
}

/* профиль */
.profile {
    margin-top: 20px;
}

/* кнопка */
.btn {
    margin-top: 30px;
    background: white;
    color: black;
    padding: 12px;
    border-radius: 12px;
    text-decoration: none;
    display: inline-block;
    width: 100%;
    font-weight: 500;
}

.btn:hover {
    background: #e5e5e5;
}

/* призрак */
.ghost {
    font-size: 60px;
    opacity: 0.7;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>
<span class="rcs">RCS</span>
<span class="portal">Portal</span>
<span id="plusBadge" class="plus" style="display:none;">★ PLUS</span>
</h1>

<div id="content"></div>

</div>

<script>
// Основная функция загрузки профиля
async function loadProfile() {
    const params = new URLSearchParams(window.location.search);
    let userId = localStorage.getItem("telegram_id");

    // Если мы только что пришли после логина (параметры в URL)
    if (params.get("id")) {
        userId = params.get("id");
        localStorage.setItem("telegram_id", userId);
        // Очищаем URL от параметров для красоты
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (!userId) {
        showGuest();
        return;
    }

    try {
        // Стучимся в твой API на Vercel
        const res = await fetch(`/api/getUser?id=${userId}`);
        
        if (!res.ok) {
            showGuest();
            return;
        }

        const data = await res.json();

        if (data.exists) {
            renderUser(data);
            // Если есть Плюс — включаем значок
            if (data.has_plus) {
                document.getElementById("plusBadge").style.display = "inline-block";
            }
        } else {
            showGuest();
        }

    } catch (err) {
        console.error("Ошибка API:", err);
        showGuest();
    }
}

// Отрисовка профиля (Material 3 style)
function renderUser(user) {
    document.getElementById("content").innerHTML = `
        <div class="profile" style="animation: fadeIn 0.5s ease;">
            <h2 style="margin-bottom:5px; font-weight: 600;">${user.first_name || user.username}</h2>
            <p style="color: #888; font-size: 14px; margin-bottom: 20px;">@${user.username}</p>
            
            <div style="background: rgba(255,255,255,0.03); padding: 16px; border: 1px solid #2c2c2c; border-radius: 16px; margin-bottom: 24px;">
                <p style="color: #666; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;">Telegram ID</p>
                <code style="font-family: monospace; font-size: 16px; color: #fff;">${user.telegram_id}</code>
            </div>

            <button onclick="logout()" class="btn" style="background: transparent; color: #ff4444; border: 1px solid #442222;">
                Выйти из аккаунта
            </button>
        </div>
    `;
}

// Состояние гостя
function showGuest() {
    document.getElementById("content").innerHTML = `
        <div class="ghost" style="margin-bottom: 10px;">👻</div>
        <p style="color: #888; margin-bottom: 20px;">Вы не авторизованы или аккаунт не найден</p>
        <a href="Auth.html" class="btn">Войти через Telegram</a>
    `;
}

// Выход
function logout() {
    localStorage.removeItem("telegram_id");
    window.location.href = "Auth.html";
}

// Точка входа
document.addEventListener("DOMContentLoaded", loadProfile);
</script>

</body>
</html>
