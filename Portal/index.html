<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCS Portal</title>

<style>
body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* контейнер */
.container {
    border: 1px solid #2c2c2c;
    border-radius: 24px;
    padding: 40px;
    width: 400px;
    text-align: center;
}

/* заголовок */
h1 {
    font-size: 32px;
    margin-bottom: 20px;
}

.rcs {
    color: white;
}

.portal {
    color: #8b5cf6;
}

/* плюс */
.plus {
    color: gold;
    font-size: 14px;
    margin-left: 6px;
}

/* профиль */
.profile {
    margin-top: 20px;
}

/* кнопка */
.btn {
    margin-top: 30px;
    background: white;
    color: black;
    padding: 12px;
    border-radius: 12px;
    text-decoration: none;
    display: inline-block;
    width: 100%;
    font-weight: 500;
}

.btn:hover {
    background: #e5e5e5;
}

/* призрак */
.ghost {
    font-size: 60px;
    opacity: 0.7;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>
<span class="rcs">RCS</span>
<span class="portal">Portal</span>
<span id="plusBadge" class="plus" style="display:none;">★ PLUS</span>
</h1>

<div id="content"></div>

</div>

<script>
const userId = localStorage.getItem("telegram_id");

async function loadProfile() {
    // 1. Пытаемся взять ID из localStorage
    let userId = localStorage.getItem("telegram_id");

    // 2. Если ID нет в памяти, но он есть в ссылке (после входа) — берем из ссылки
    const params = new URLSearchParams(window.location.search);
    if (!userId && params.get("id")) {
        userId = params.get("id");
        localStorage.setItem("telegram_id", userId);
    }

    if (!userId) {
        showGuest();
        return;
    }

    try {
        // Запрос к твоему новому API на Vercel
        const res = await fetch(`/api/getUser?id=${userId}`);
        const data = await res.json();

        if (data.exists === false) {
            showGuest();
            return;
        }

        // Показываем профиль
        showUser(data);

        // Показываем золотой значок Плюса, если в базе true
        if (data.has_plus) {
            document.getElementById("plusBadge").style.display = "inline-block";
        }

    } catch (err) {
        console.error("Ошибка сети:", err);
        showGuest();
    }
}

function showUser(user) {
    document.getElementById("content").innerHTML = `
        <div class="profile">
            <h2 style="margin-bottom:5px;">${user.first_name || user.username}</h2>
            <p style="color: #888; font-size: 14px;">@${user.username}</p>
            <div style="margin-top: 20px; padding: 15px; border: 1px solid #2c2c2c; border-radius: 12px;">
                <span style="color: #888;">ID:</span> ${user.telegram_id}
            </div>
            <button onclick="logout()" class="btn" style="background: transparent; color: #ff4444; border: 1px solid #442222; margin-top: 20px;">Выйти</button>
        </div>
    `;
}

function logout() {
    localStorage.removeItem("telegram_id");
    window.location.href = "Auth.html";
}

const params = new URLSearchParams(window.location.search);

const user = {
    id: params.get("id"),
    username: params.get("username"),
    first_name: params.get("first_name"),
    hash: params.get("hash")
};

if (user.id) {
    console.log("LOGGED IN:", user);

    // можно сохранить в базу
    fetch("/api/createUser", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(user)
    });
}

// 👻 гость
function showGuest() {
    document.getElementById("content").innerHTML = `
        <div class="ghost">👻</div>
        <p>Вы не вошли</p>
        <a href="/Portal/Auth.html" class="btn">Войти в портал</a>
    `;
}

// 👤 пользователь
function showUser(user) {
    document.getElementById("content").innerHTML = `
        <div class="profile">
            <h2>${user.username}</h2>
            <p>ID: ${user.id}</p>
        </div>
    `;
}

// запуск
loadProfile();
</script>

</body>
</html>
