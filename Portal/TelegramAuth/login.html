<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход через Telegram </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* Vercel-inspired grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* Main container */
        .login-container {
            background: #000000;
            border: 1px solid #2c2c2c;
            border-radius: 24px;
            padding: 64px 48px;
            max-width: 520px;
            width: 90%;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 40px 24px;
                width: 95%;
                border-radius: 20px;
            }
        }

        /* Logo area */
        .logo {
            margin-bottom: 48px;
            display: flex;
            justify-content: center;
        }

        .vercel-icon {
            width: 48px;
            height: 48px;
            background: #ffffff;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            opacity: 0.9;
        }

        /* Typography */
        h1 {
            font-size: 36px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888888;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Widget container - enlarged for button */
        #telegram-widget {
            margin: 32px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Iframe styling */
        #telegram-widget iframe {
            transition: all 0.2s ease;
            filter: brightness(0.95) contrast(1.1);
        }

        #telegram-widget iframe:hover {
            transform: scale(1.02);
            filter: brightness(1) contrast(1.2);
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #888888;
            font-size: 14px;
            font-weight: 400;
        }

        .loading::after {
            content: '';
            width: 18px;
            height: 18px;
            border: 2px solid #2c2c2c;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fallback button - Vercel style */
        .fallback-button {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #2c2c2c;
        }

        .telegram-login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #ffffff;
            color: #000000;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            font-family: inherit;
            letter-spacing: -0.01em;
        }

        .telegram-login-btn:hover {
            background: #e5e5e5;
            transform: translateY(-1px);
        }

        .telegram-login-btn:active {
            transform: translateY(0);
        }

        /* Info section */
        .info {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #2c2c2c;
        }

        .info-items {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666666;
            font-size: 12px;
            font-weight: 400;
        }

        .info-item::before {
            content: '✓';
            color: #ffffff;
            font-size: 12px;
        }

        /* Error message */
        .error {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 12px;
            color: #ff4444;
            font-size: 13px;
            display: none;
            backdrop-filter: blur(10px);
        }

        /* Status badges */
        .status-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 11px;
            color: #666666;
            font-family: monospace;
            border: 1px solid #2c2c2c;
            z-index: 100;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            animation: fadeIn 0.5s ease-out;
        }

        /* Focus states */
        button:focus-visible, a:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="login-container">
       

        <h1>Вход через Telegram</h1>
         <sh1>RCS Portal</sh1>
        <p class="subtitle">
            Авторизуйтесь с помощью Telegram<br>
            для доступа к сервису
        </p>
        
        <!-- Enlarged container for widget -->
        <div id="telegram-widget">
            <div class="loading">Загрузка виджета</div>
        </div>
        
        <!-- Fallback option -->
        <div class="fallback-button" style="display: none;" id="fallbackButton">
            <button onclick="redirectToTelegram()" class="telegram-login-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z" fill="currentColor"/>
                </svg>
                Продолжить через Telegram
            </button>
        </div>
        
        <div class="info">
            <div class="info-items">
                <div class="info-item">Безопасная авторизация</div>
                <div class="info-item">Защищено Telegram</div>
                <div class="info-item">Мгновенный вход</div>
            </div>
        </div>
        
        <div class="error" id="errorMessage"></div>
    </div>

    <script>
    // Конфигурация
    const BOT_USERNAME = 'rcstg_robot';
    const API_URL = 'https://rcatcloud2.vercel.app/api/createUser';
    
    // Эта функция вызывается когда юзер нажимает "Принять" в виджете
    async function onTelegramAuth(user) {
        console.log('🔑 Получены данные от Telegram:', user);
        
        // 1. Сохраняем ВСЕ данные в localStorage
        localStorage.setItem("telegram_id", user.id);
        localStorage.setItem("telegram_username", user.username || '');
        localStorage.setItem("telegram_first_name", user.first_name || '');
        
        // 2. Показываем статус
        const widgetContainer = document.getElementById('telegram-widget');
        widgetContainer.innerHTML = '<div class="loading">Создаём аккаунт...</div>';
        
        try {
            // 3. Отправляем данные на API для автосоздания аккаунта
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    id: user.id,
                    username: user.username,
                    first_name: user.first_name
                })
            });

            const data = await response.json();
            
            if (!data.ok) {
                throw new Error(data.error || 'Ошибка API');
            }
            
            console.log(`✅ ${data.message || 'Аккаунт готов'}`);
            
            // 4. Редирект на Portal с параметрами (для надёжности)
            window.location.href = `/Portal?id=${user.id}&username=${user.username || ''}&first_name=${user.first_name || ''}`;
            
        } catch (error) {
            console.error('❌ Ошибка:', error);
            
            // Показываем ошибку
            const errorDiv = document.getElementById('errorMessage');
            if (errorDiv) {
                errorDiv.innerHTML = `
                    <p style="margin-bottom: 12px;">⚠️ Не удалось создать аккаунт</p>
                    <button onclick="window.location.reload()" 
                            style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: inherit;">
                        Попробовать снова
                    </button>
                `;
                errorDiv.style.display = 'block';
            }
            
            // Показываем fallback кнопку
            const fallbackBtn = document.getElementById('fallbackButton');
            if (fallbackBtn) {
                fallbackBtn.style.display = 'block';
            }
        }
    }
    
    // Инициализация виджета
    function initWidget() {
        const container = document.getElementById('telegram-widget');
        const script = document.createElement('script');
        script.src = "https://telegram.org/js/telegram-widget.js?22";
        script.setAttribute('data-telegram-login', BOT_USERNAME);
        script.setAttribute('data-size', 'large');
        script.setAttribute('data-radius', '12');
        script.setAttribute('data-onauth', 'onTelegramAuth(user)');
        script.setAttribute('data-request-access', 'write');
        container.innerHTML = '';
        container.appendChild(script);
    }

    // Fallback редирект на бота
    function redirectToTelegram() {
        window.open(`https://t.me/${BOT_USERNAME}`, '_blank');
    }

    document.addEventListener('DOMContentLoaded', initWidget);
    console.log('%c⚡ rcs • telegram auth ready', 'color: #ffffff; background: #000000; padding: 4px 8px; border-radius: 4px; font-family: monospace;');
</script>
</body>
</html>
