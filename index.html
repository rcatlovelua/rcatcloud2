<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strange Reality</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Maze&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .eye-gif {
            width: 200px; 
            margin-bottom: 20px;
            filter: hue-rotate(90deg); 
        }

        .roblox-text {
            font-family: 'Rubik Maze', system-ui;
            font-size: 80px; /* Уменьшил, чтобы длинные фразы влезали */
            color: red;
            text-align: center;
            -webkit-text-stroke: 2px red; 
            letter-spacing: 2px;
            transition: all 0.5s ease;
            max-width: 90vw;
            word-wrap: break-word;
        }

        /* Класс для перевернутого текста */
        .upside-down {
            display: inline-block;
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <img src="https://rcatcloud2.vercel.app/cloud/oeil.gif" alt="Eye" class="eye-gif">

    <div id="random-text" class="roblox-text"></div>

    <script>
        const phrases = [
            "WIR SIND BEOBACHTER",
            "DAS ENDE IST NAH",  
            "NICHTS IST REAL",   
            "SYSTEMFEHLER 404", 
            "VOID CALLING",
            "LOOK BEHIND YOU",
            "ECHOES OF SILENCE",
            "01001000 01000101 01001100 01001100 01001111"
        ];

        function flipString(str) {
            return str.split('').reverse().join('');
        }

        const textElement = document.getElementById('random-text');
        
        let randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];

    
        textElement.innerHTML = randomPhrase;
        textElement.classList.add('upside-down');

   
        setInterval(() => {
            textElement.style.transform = `rotate(180deg) translate(${Math.random() * 50 - 5}px, ${Math.random() * 4 - 2}px)`;
        }, 100);
    </script>
</body>
</html>
