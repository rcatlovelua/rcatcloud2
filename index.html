<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage | Beta</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #0084ff;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Анимированный фон */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--accent-blue);
            filter: blur(150px);
            border-radius: 50%;
            animation: move 15s infinite alternate;
            opacity: 0.3;
        }

        @keyframes move {
            from { transform: translate(-300px, -200px); }
            to { transform: translate(300px, 200px); }
        }

        /* Стеклянная карточка */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            width: 350px;
            z-index: 1;
        }

        .status-badge {
            display: inline-block;
            background: rgba(0, 132, 255, 0.2);
            color: var(--accent-blue);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 { margin: 10px 0; font-size: 24px; }
        p { opacity: 0.7; font-size: 0.9rem; line-height: 1.6; }

        /* Прогресс-бар для "облака" */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 25px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-blue);
            width: 45%;
            animation: loading 3s infinite ease-in-out;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 0%; }
        }

        .footer-note {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="glass-card">
        <div class="status-badge">В разработке</div>
        <h1>Cloud Data System</h1>
        <p>На данный момент сервер используется как закрытое облачное хранилище. Доступ к публичным функциям будет открыт после завершения бета-тестирования.</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <p style="font-size: 0.8rem; font-weight: bold;">Синхронизация данных... 45%</p>
        
        <div class="footer-note">© 2026 Core Infrastructure. Доступ ограничен.</div>
    </div>

</body>
</html>
