<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В разработке</title>
    
    <!-- Geist Font через CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">

    <style>
        /* ==========================================
           1. ПОДКЛЮЧЕНИЕ ПИКСЕЛЬНОГО ШРИФТА FFFLAUTA
           ========================================== */
        @font-face {
            font-family: 'FFFlauta';
            src: url('https://dump.justrcat.lol/fonts/ffflauta/FFFlauta-Regular.woff2') format('woff2'),
                 url('https://dump.justrcat.lol/fonts/ffflauta/FFFlauta-Regular.ttf') format('truetype'),
                 local('FFFlauta');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================
           2. СТИЛИ СТРАНИЦЫ
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Geist Sans', 'Geist', -apple-system, sans-serif;
            background-color: #0b0d10;
            color: #888d96;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Фоновый свет СВЕРХУ */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            width: 400px;
            height: 400px;
            background: rgba(29, 106, 255, 0.15);
            filter: blur(140px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Фоновый свет СНИЗУ */
        body::after {
            content: '';
            position: absolute;
            bottom: -100px;
            width: 450px;
            height: 450px;
            background: rgba(29, 106, 255, 0.12);
            filter: blur(150px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            max-width: 850px;
            width: 100%;
            margin: auto 0;
        }

        /* Стили картинки слева */
        .side-image {
            width: 100%;
            max-width: 240px;
            height: auto;
            aspect-ratio: 640 / 889;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
        }

        .content {
            text-align: left;
            max-width: 480px;
        }

        /* ЗАГОЛОВОК */
        h1 {
            font-family: 'FFFlauta', monospace, sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: rgba(29, 106, 255, 1);
            margin-bottom: 16px;
            line-height: 1;
            white-space: nowrap;
            
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
            text-rendering: optimizeSpeed;
        }

        /* ПОДЗАГОЛОВОК */
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: #a0a6b2;
            font-weight: 500;
            margin-bottom: 12px;
        }

        /* ТЕКСТ */
        p {
            font-size: 0.95rem;
            color: #6a707c;
            line-height: 1.6;
        }

        /* ==========================================
           3. ФУТЕР (ВНИЗУ)
           ========================================== */
        footer {
            position: relative;
            z-index: 1;
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 0.85rem;
            color: #525866;
            flex-wrap: wrap;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #888d96;
            text-decoration: none;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .github-link:hover {
            color: rgba(29, 106, 255, 1);
            opacity: 0.9;
        }

        .github-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 4px; /* Квадратная иконка */
        }

        /* Адаптив для мобилок */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                text-align: center;
            }

            .content {
                text-align: center;
            }

            .side-image {
                max-width: 170px;
            }

            footer {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Картинка слева -->
        <img 
            src="https://dump.justrcat.lol/images/cute-sit-mc.webp" 
            alt="Illustration" 
            class="side-image"
            width="640" 
            height="889"
        >

        <!-- Основной контент справа -->
        <div class="content">
            <h1>IN DEV</h1>
            
            <div class="subtitle">Скоро здесь появится кое-что интересное</div>
            
            <p>Мы работаем над сайтом. Вернемся совсем скоро с обновленным функционалом и новым дизайном.</p>
        </div>
    </div>

    <!-- Футер -->
    <footer>
        <span>jr (MIT-Лицензия)</span>
        <span>•</span>
        <a href="https://github.com/rcatlovelua/rcatcloud2" target="_blank" rel="noopener noreferrer" class="github-link">
            <span>Justrcat на GitHub:</span>
            <img src="https://dump.justrcat.lol/images/github-big.svg" alt="GitHub" class="github-icon">
        </a>
    </footer>

    <!-- Пасхалка в консоли (Discord style) -->
    <script>
        console.log(
            "%c Привет! %c\n\nПриходи помогать с кодом: https://justrcat.lol/yawork",
            "color: #1d6aff; font-size: 32px; font-weight: bold; -webkit-text-stroke: 1px black;",
            "color: #a0a6b2; font-size: 16px; font-weight: 500;"
        );
    </script>

</body>
</html>
