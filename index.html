<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Технические работы</title>

  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      /* ЧЁРНО-ЗЕЛЁНЫЙ СТИЛЬ */
      background: radial-gradient(circle at 30% 30%, #0f1f0f, #000000 70%);
      color: #b6ffb0;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 2;
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-weight: 900;
      font-size: 64px;
      color: #8cff7a;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
      color: #eaffea;
      opacity: 0.85;
    }

    /* КАРТИНКА ПОВЕРХ */
    .art {
      position: fixed;
      right: -100px;
      bottom: -50px;
      width: 700px;
      z-index: 3;
      pointer-events: none;
    }

    .art img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 60px rgba(0, 255, 100, 0.25));
    }

    /* свечение текста */
    h1::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 140%;
      height: 140%;
      background: radial-gradient(circle, rgba(0,255,100,0.25), transparent);
      filter: blur(60px);
      z-index: -1;
    }

    @media (max-width: 900px) {
      .art {
        width: 400px;
        right: -80px;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      .art {
        width: 280px;
        right: -60px;
        bottom: -30px;
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>

  <!-- КАРТИНКА -->
  <div class="art">
    <img src="https://rcs.qd.je/tehzakrito.png" alt="art">
  </div>

  <!-- ТЕКСТ -->
  <div class="container">
    <h1>Технические работы</h1>
    <p>Сайт временно недоступен. Мы скоро вернёмся.</p>
  </div>

</body>
</html>
