<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Devs</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f9fe;
            font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 32px 20px;
            color: #1c1b1f;
        }

        .material-container {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }

        .app-bar {
            margin-bottom: 28px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-title {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.25px;
            background: linear-gradient(135deg, #1e1e2f, #3b3b5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .app-title span {
            background: none;
            color: #6750a4;
            font-size: 2rem;
        }
        .badge {
            background: #eaddff;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #381e72;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .create-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
            transition: box-shadow 0.2s ease;
            margin-bottom: 32px;
            padding: 20px 24px 24px 24px;
        }
        .create-card:focus-within {
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.12), 0 2px 4px -1px rgba(0,0,0,0.08);
        }
        .input-field {
            margin-bottom: 20px;
            position: relative;
        }
        .input-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #49454f;
            margin-bottom: 6px;
            margin-left: 12px;
        }
        .material-input, .material-textarea {
            width: 100%;
            background: #f3f1f4;
            border: 1px solid #e6e0e9;
            border-radius: 16px;
            padding: 12px 16px;
            font-family: 'Roboto', monospace;
            font-size: 1rem;
            transition: all 0.2s;
            color: #1c1b1f;
            outline: none;
            resize: vertical;
        }
        .material-input:focus, .material-textarea:focus {
            border-color: #6750a4;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(103, 80, 164, 0.2);
        }
        .material-textarea {
            min-height: 96px;
        }
        .btn-filled {
            background: #6750a4;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-weight: 500;
            font-size: 0.875rem;
            letter-spacing: 0.1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
        }
        .btn-filled:hover {
            background: #4f378a;
            box-shadow: 0 2px 4px 0 rgba(0,0,0,0.1);
            transform: translateY(-1px);
        }
        .btn-filled:active {
            transform: translateY(1px);
        }
        .btn-filled:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            color: #6750a4;
            border: 1px solid #6750a4;
            padding: 6px 16px;
            font-size: 0.75rem;
        }
        .btn-outline:hover {
            background: #f3edff;
            transform: none;
        }
        .button-wrapper {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .feed-title {
            font-size: 1.25rem;
            font-weight: 500;
            margin: 8px 0 16px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1c1b1f;
        }
        .feed-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .post-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px 0 rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            padding: 20px 24px;
            border-left: 6px solid #6750a4;
            position: relative;
            overflow: hidden;
        }
        .post-card:hover {
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.1), 0 2px 4px 0 rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }
        .post-title {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1c1b1f;
            line-height: 1.3;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .post-title-icon {
            color: #6750a4;
            font-size: 1.6rem;
        }
        .post-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #49454f;
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 8px;
        }
        .post-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #6750a4;
        }
        .post-author .material-symbols-outlined {
            font-size: 1.1rem;
            color: #6750a4;
        }
        .author-name {
            font-weight: 500;
            color: #381e72;
        }
        .post-time {
            font-size: 0.7rem;
            color: #79747e;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-actions {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #e6e0e9;
        }
        .action-btn {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #6750a4;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .action-btn:hover {
            background: #f3edff;
        }
        .action-btn .material-symbols-outlined {
            font-size: 1rem;
        }
        .replies-section {
            margin-top: 16px;
            padding-left: 20px;
            border-left: 2px solid #eaddff;
        }
        .reply-card {
            background: #fef7ff;
            border-radius: 20px;
            padding: 12px 16px;
            margin-top: 12px;
            font-size: 0.85rem;
        }
        .reply-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .reply-author {
            font-weight: 600;
            color: #6750a4;
        }
        .reply-time {
            font-size: 0.65rem;
            color: #79747e;
        }
        .reply-content {
            color: #49454f;
            margin-top: 6px;
        }
        .reply-form {
            margin-top: 12px;
            display: none;
            gap: 8px;
            flex-direction: column;
        }
        .reply-form.active {
            display: flex;
        }
        .reply-input {
            width: 100%;
            background: #f3f1f4;
            border: 1px solid #e6e0e9;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-family: 'Roboto', sans-serif;
            resize: vertical;
        }
        .reply-input:focus {
            border-color: #6750a4;
            outline: none;
        }
        .small-btn {
            padding: 6px 16px;
            font-size: 0.75rem;
            align-self: flex-end;
        }
        .empty-state {
            background: #ffffffd9;
            border-radius: 32px;
            padding: 48px 24px;
            text-align: center;
            color: #79747e;
            font-weight: 500;
            border: 1px dashed #cac4d0;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: #6750a4;
            gap: 12px;
        }
        .info-note {
            background: #eaddff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #381e72;
            margin-bottom: 16px;
            display: inline-block;
        }
        @keyframes subtlePop {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .post-card {
            animation: subtlePop 0.25s ease-out;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 560px) {
            body { padding: 20px 16px; }
            .post-title { font-size: 1.2rem; }
            .create-card { padding: 16px 20px; }
        }
        .toast-message {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #323232;
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            backdrop-filter: blur(8px);
            background: rgba(30,30,40,0.9);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

<div class="material-container">
    <div class="app-bar">
        <div class="app-title" id="refreshFeed">
            <span class="material-symbols-outlined">developer_mode</span>
            Devs
        </div>
        <div class="badge">
            <span class="material-symbols-outlined" style="font-size: 14px;">rss_feed</span> 
            Лента сообщества
        </div>
    </div>

    <div class="info-note">
        <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: middle;">info</span>
        У базы данных память 30 мб, фотки не поддерживаются
    </div>

    <div class="create-card">
        <div class="input-field">
            <label>ВАШЕ ИМЯ</label>
            <input type="text" id="authorName" class="material-input" placeholder="Как вас зовут?" autocomplete="off" maxlength="50">
        </div>
        <div class="input-field">
            <label>ЗАГОЛОВОК</label>
            <input type="text" id="title" class="material-input" placeholder="О чем расскажете?" autocomplete="off">
        </div>
        <div class="input-field">
            <label>КОНТЕНТ</label>
            <textarea id="content" class="material-textarea" rows="3" placeholder="Что нового? Идеи, код, мысли..."></textarea>
        </div>
        <div class="input-field">
            <label>СЕКРЕТНЫЙ КЛЮЧ</label>
            <input type="password" id="adminPassword" class="material-input" placeholder="Пароль для публикации">
        </div>
        <div class="button-wrapper">
            <button class="btn-filled" id="publishBtn">
                <span class="material-symbols-outlined" style="font-size: 18px;">send</span> 
                Опубликовать
            </button>
        </div>
    </div>

    <div class="feed-title">
        <span class="material-symbols-outlined" style="font-size: 22px;">dynamic_feed</span> 
        Последние обсуждения
    </div>
    <div id="feed" class="feed-grid">
        <div class="loading-spinner">
            <span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">progress_activity</span> 
            <span>Загрузка постов...</span>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-message"></div>

<script>
    const API_BASE = '/api/post';
    let allPosts = [];

    function showToast(message, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = message;
        toast.style.opacity = '1';
        toast.style.background = isError ? '#b3261e' : '#2b2a33';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatTime(timestamp) {
        if (!timestamp) return 'только что';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);
        
        if (diff < 60) return 'только что';
        if (diff < 3600) return `${Math.floor(diff / 60)} мин назад`;
        if (diff < 86400) return `${Math.floor(diff / 3600)} ч назад`;
        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function getAvatarColor(name) {
        if (!name) return '#6750a4';
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = ((hash << 5) - hash) + name.charCodeAt(i);
            hash |= 0;
        }
        const colors = ['#6750a4', '#0b57d0', '#e95e2e', '#008b6b', '#b3261e', '#a653b6', '#c96f0e'];
        return colors[Math.abs(hash) % colors.length];
    }

    function toggleReplyForm(postId) {
        const form = document.getElementById(`reply-form-${postId}`);
        if (form) {
            form.classList.toggle('active');
            if (form.classList.contains('active')) {
                form.querySelector('.reply-input')?.focus();
            }
        }
    }

    async function sendReply(postId, parentPost) {
        const form = document.getElementById(`reply-form-${postId}`);
        const input = form?.querySelector('.reply-input');
        const replyContent = input?.value.trim();
        const authorInput = document.getElementById('authorName');
        const author = authorInput.value.trim() || 'Аноним';
        const passwordInput = document.getElementById('adminPassword');
        const password = passwordInput.value.trim();

        if (!replyContent) {
            showToast('Напишите текст ответа', true);
            return;
        }

        if (!password) {
            showToast('Введите секретный ключ для ответа', true);
            return;
        }

        const replyData = {
            postId: postId,
            content: replyContent,
            author: author,
            password: password,
            parentTitle: parentPost?.title || 'пост'
        };

        try {
            const response = await fetch('/api/reply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(replyData)
            });

            if (!response.ok) {
                if (response.status === 403) throw new Error('Неверный пароль');
                throw new Error('Ошибка отправки ответа');
            }

            input.value = '';
            form.classList.remove('active');
            showToast('Ответ опубликован!', false);
            await loadPosts();
        } catch (error) {
            showToast(error.message, true);
        }
    }

    function renderPosts(posts) {
        const feedContainer = document.getElementById('feed');
        feedContainer.innerHTML = '';

        if (posts.length === 0) {
            feedContainer.innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-outlined" style="font-size: 48px; margin-bottom: 12px; display: block;">forum</span>
                    Пока нет постов. Будьте первым!
                </div>
            `;
            return;
        }

        // Сортируем по timestamp, новые сверху
        const sortedPosts = [...posts].sort((a, b) => (b.timestamp || b.id || 0) - (a.timestamp || a.id || 0));

        for (const post of sortedPosts) {
            const title = post.title?.trim() || 'Без заголовка';
            const content = post.content?.trim() || '✨ Нет содержимого';
            const author = post.author?.trim() || 'Аноним';
            const authorColor = getAvatarColor(author);
            const timestamp = post.timestamp || post.id;
            const timeStr = formatTime(timestamp);
            const replies = post.replies || [];
            const postId = post.id || timestamp;

            const postCard = document.createElement('div');
            postCard.className = 'post-card';
            
            let repliesHtml = '';
            if (replies.length > 0) {
                const sortedReplies = [...replies].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                repliesHtml = `<div class="replies-section">`;
                for (const reply of sortedReplies) {
                    const replyAuthor = reply.author || 'Аноним';
                    const replyTime = formatTime(reply.timestamp);
                    repliesHtml += `
                        <div class="reply-card">
                            <div class="reply-header">
                                <span class="reply-author">${escapeHtml(replyAuthor)}</span>
                                <span class="reply-time">${replyTime}</span>
                            </div>
                            <div class="reply-content">${escapeHtml(reply.content).replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                }
                repliesHtml += `</div>`;
            }

            postCard.innerHTML = `
                <div class="post-title">
                    <span class="material-symbols-outlined post-title-icon">article</span>
                    ${escapeHtml(title)}
                </div>
                <div class="post-content">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                <div class="post-author">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="author-name" style="color: ${authorColor};">${escapeHtml(author)}</span>
                    <span class="post-time">
                        <span class="material-symbols-outlined" style="font-size: 14px;">schedule</span>
                        ${timeStr}
                    </span>
                </div>
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleReplyForm(${postId})">
                        <span class="material-symbols-outlined">reply</span>
                        Ответить (${replies.length})
                    </button>
                </div>
                <div id="reply-form-${postId}" class="reply-form">
                    <textarea class="reply-input" rows="2" placeholder="Напишите ответ..."></textarea>
                    <button class="btn-filled small-btn" onclick="sendReply(${postId}, {title: '${escapeHtml(title).replace(/'/g, "\\'")}'})">
                        Отправить ответ
                    </button>
                </div>
                ${repliesHtml}
            `;
            feedContainer.appendChild(postCard);
        }
    }

    async function loadPosts() {
        const feedContainer = document.getElementById('feed');
        feedContainer.innerHTML = `
            <div class="loading-spinner">
                <span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">sync</span>
                <span>Обновление ленты...</span>
            </div>
        `;
        
        try {
            const response = await fetch(API_BASE);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            let posts = await response.json();
            
            if (!Array.isArray(posts)) posts = posts ? [posts] : [];
            
            // Загружаем ответы для каждого поста
            for (let post of posts) {
                try {
                    const repliesRes = await fetch(`/api/reply?postId=${post.id || post.timestamp}`);
                    if (repliesRes.ok) {
                        const replies = await repliesRes.json();
                        post.replies = Array.isArray(replies) ? replies : [];
                    } else {
                        post.replies = [];
                    }
                } catch (e) {
                    post.replies = [];
                }
            }
            
            allPosts = posts;
            renderPosts(posts);
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            feedContainer.innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-outlined" style="font-size: 48px;">error</span>
                    <p>Не удалось загрузить ленту. Проверьте соединение.</p>
                    <button id="retryLoadBtn" style="margin-top: 16px; background: #6750a4; border: none; border-radius: 40px; padding: 8px 20px; color: white; font-weight: 500; cursor: pointer;">Повторить</button>
                </div>
            `;
            const retryBtn = document.getElementById('retryLoadBtn');
            if (retryBtn) retryBtn.addEventListener('click', () => loadPosts());
            showToast('Ошибка загрузки ленты', true);
        }
    }

    async function sendPost() {
        const authorInput = document.getElementById('authorName');
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const passwordInput = document.getElementById('adminPassword');
        
        const authorRaw = authorInput.value.trim();
        const titleRaw = titleInput.value.trim();
        const contentRaw = contentInput.value.trim();
        const passwordRaw = passwordInput.value.trim();
        
        if (titleRaw === '' && contentRaw === '') {
            showToast('Заполните заголовок или содержание поста', true);
            return;
        }

        if (passwordRaw === '') {
            showToast('Введите секретный ключ!', true);
            return;
        }
        
        const finalAuthor = authorRaw === '' ? 'Аноним' : authorRaw;
        const timestamp = Date.now();
        
        const postData = {
            id: timestamp,
            title: titleRaw || "(без названия)",
            content: contentRaw || "—",
            password: passwordRaw,
            author: finalAuthor,
            timestamp: timestamp
        };
        
        const publishButton = document.getElementById('publishBtn');
        const originalButtonText = publishButton.innerHTML;
        
        publishButton.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px; animation: spin 0.8s linear infinite;">progress_activity</span> Отправка...`;
        publishButton.disabled = true;
        
        try {
            const response = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData)
            });
            
            if (!response.ok) {
                if (response.status === 403) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Неверный пароль!");
                }
                throw new Error(`Ошибка ${response.status}`);
            }
            
            authorInput.value = '';
            titleInput.value = '';
            contentInput.value = '';
            passwordInput.value = '';
            
            showToast(`Пост опубликован от имени ${escapeHtml(finalAuthor)}! 🚀`, false);
            await loadPosts();
            
            const feedElement = document.getElementById('feed');
            if (feedElement.firstChild) {
                feedElement.firstChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        } catch (error) {
            console.error('Ошибка отправки:', error);
            showToast(error.message, true);
        } finally {
            publishButton.innerHTML = originalButtonText;
            publishButton.disabled = false;
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        const publishBtn = document.getElementById('publishBtn');
        if (publishBtn) publishBtn.addEventListener('click', sendPost);
        
        const textarea = document.getElementById('content');
        if (textarea) {
            textarea.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    sendPost();
                }
            });
        }
        
        const refreshBtn = document.getElementById('refreshFeed');
        if (refreshBtn) refreshBtn.addEventListener('click', () => loadPosts());
        
        const badge = document.querySelector('.badge');
        if (badge) {
            badge.style.cursor = 'pointer';
            badge.addEventListener('click', () => loadPosts());
        }
        
        loadPosts();
    });

    window.toggleReplyForm = toggleReplyForm;
    window.sendReply = sendReply;

    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .btn-filled { position: relative; overflow: hidden; }
        .btn-filled::after {
            content: ''; display: block; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            pointer-events: none; background-image: radial-gradient(circle, #fff 10%, transparent 10%);
            background-repeat: no-repeat; background-position: 50%; transform: scale(10);
            opacity: 0; transition: transform 0.4s, opacity 0.6s;
        }
        .btn-filled:active::after { transform: scale(0); opacity: 0.3; transition: 0s; }
        .badge { transition: all 0.2s ease; cursor: pointer; }
        .badge:hover { background: #d9c9ff; transform: scale(0.98); }
        .app-title { transition: opacity 0.2s; cursor: pointer; }
        .app-title:hover { opacity: 0.8; }
    `;
    document.head.appendChild(styleSheet);
</script>
</body>
</html>
