<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авто-редирект</title>
</head>
<body>
    <script>
        // ===== НАСТРОЙКИ (меняй здесь) =====
        const targetUrl = "https://t.me/rcstg_robot";  // Сюда вставь свой URL
        const delaySeconds = 3;                    // Задержка в секундах
        // ====================================
        
        if (delaySeconds > 0) {
            document.write('<div style="text-align:center; padding:50px; font-family:sans-serif;">Редирект через ' + delaySeconds + ' секунд...</div>');
            setTimeout(function() {
                window.location.href = targetUrl;
            }, delaySeconds * 1000);
        } else {
            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
