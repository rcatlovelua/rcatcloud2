<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCS Portal</title>

<style>
body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    border: 1px solid #2c2c2c;
    border-radius: 24px;
    padding: 40px;
    width: 400px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 20px;
}

.rcs { color: white; }
.portal { color: #8b5cf6; }
.plus { color: gold; font-size: 14px; margin-left: 6px; }

.profile { margin-top: 20px; }

.btn {
    margin-top: 12px;
    background: white;
    color: black;
    padding: 12px;
    border-radius: 12px;
    text-decoration: none;
    display: inline-block;
    width: 100%;
    font-weight: 500;
    border: none;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

.btn:hover { background: #e5e5e5; }
.btn-outline {
    background: transparent;
    color: #ff4444;
    border: 1px solid #442222;
}
.btn-outline:hover { background: #1a0a0a; }

.ghost {
    font-size: 60px;
    opacity: 0.7;
    margin-top: 20px;
}

.login-input {
    width: 100%;
    padding: 12px;
    background: #0a0a0a;
    border: 1px solid #2c2c2c;
    border-radius: 12px;
    color: white;
    font-size: 14px;
    margin-bottom: 12px;
    box-sizing: border-box;
}

.login-input:focus {
    border-color: #8b5cf6;
    outline: none;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.profile { animation: fadeIn 0.5s ease; }
</style>
</head>
<body>

<div class="container">
<h1>
<span class="rcs">RCS</span>
<span class="portal">Portal</span>
<span id="plusBadge" class="plus" style="display:none;">★ PLUS</span>
</h1>

<div id="content"></div>
</div>

<script>
// ===================== КОНФИГ =====================
const API_BASE = '/api/guys';
const TELEGRAM_ID_KEY = 'telegram_id';

// ===================== УТИЛИТЫ =====================
function getTelegramId() {
    return localStorage.getItem(TELEGRAM_ID_KEY);
}

function setTelegramId(id) {
    localStorage.setItem(TELEGRAM_ID_KEY, id);
}

async function apiCall(action, method = 'GET', body = null) {
    const url = `${API_BASE}?action=${action}`;
    const options = {
        method,
        headers: { 'Content-Type': 'application/json' }
    };
    if (body) options.body = JSON.stringify(body);
    
    try {
        const res = await fetch(url, options);
        return res.json();
    } catch (e) {
        console.error('API Error:', e);
        return { error: e.message };
    }
}

// ===================== АВТОРИЗАЦИЯ =====================

async function login() {
    const username = document.getElementById('loginUsername')?.value.trim();
    const password = document.getElementById('loginPassword')?.value.trim();
    
    if (!username || !password) {
        alert('Введите логин и пароль');
        return;
    }
    
    try {
        // Ищем пользователя по username
        const users = await apiCall('getUsers');
        const user = users.find(u => u.username === username);
        
        if (!user) {
            alert('Пользователь не найден');
            return;
        }
        
        // Проверяем пароль (в реальности через /api/getUser с паролем)
        const check = await apiCall(`getUser&id=${user.telegram_id}`);
        
        if (check.exists) {
            // Сохраняем ID
            setTelegramId(user.telegram_id);
            // Переходим в мессенджер
            window.location.href = '/guys';
        } else {
            alert('Ошибка авторизации');
        }
    } catch (e) {
        alert('Ошибка: ' + e.message);
    }
}

function showLogin() {
    document.getElementById('content').innerHTML = `
        <div style="margin-top:20px;">
            <input id="loginUsername" class="login-input" placeholder="Имя пользователя" />
            <input id="loginPassword" class="login-input" type="password" placeholder="Пароль" />
            <button class="btn" onclick="login()">Войти</button>
            <button class="btn btn-outline" onclick="showRegister()" style="margin-top:8px;">Зарегистрироваться</button>
        </div>
    `;
}

function showRegister() {
    document.getElementById('content').innerHTML = `
        <div style="margin-top:20px;">
            <input id="regUsername" class="login-input" placeholder="Имя пользователя" />
            <input id="regPassword" class="login-input" type="password" placeholder="Пароль" />
            <input id="regFirstName" class="login-input" placeholder="Ваше имя" />
            <button class="btn" onclick="register()">Зарегистрироваться</button>
            <button class="btn btn-outline" onclick="showLogin()" style="margin-top:8px;">Уже есть аккаунт? Войти</button>
        </div>
    `;
}

async function register() {
    const username = document.getElementById('regUsername')?.value.trim();
    const password = document.getElementById('regPassword')?.value.trim();
    const firstName = document.getElementById('regFirstName')?.value.trim();
    
    if (!username || !password) {
        alert('Заполните все поля');
        return;
    }
    
    try {
        const result = await apiCall('register', 'POST', {
            username,
            password,
            first_name: firstName || username
        });
        
        if (result.success) {
            alert('Регистрация успешна! Теперь войдите.');
            showLogin();
        } else {
            alert('Ошибка: ' + (result.error || 'Неизвестная ошибка'));
        }
    } catch (e) {
        alert('Ошибка: ' + e.message);
    }
}

// ===================== ЗАГРУЗКА ПРОФИЛЯ =====================

async function loadProfile() {
    const userId = getTelegramId();
    
    if (!userId) {
        showLogin();
        return;
    }
    
    try {
        const data = await apiCall(`getUser&id=${userId}`);
        
        if (data.exists) {
            renderUser(data);
            if (data.has_plus) {
                document.getElementById('plusBadge').style.display = 'inline-block';
            }
        } else {
            showLogin();
        }
    } catch (err) {
        console.error('Ошибка:', err);
        showLogin();
    }
}

function renderUser(user) {
    document.getElementById('content').innerHTML = `
        <div class="profile">
            <h2 style="margin-bottom:5px; font-weight:600;">${user.first_name || user.username}</h2>
            <p style="color:#888; font-size:14px; margin-bottom:20px;">@${user.username}</p>
            
            <div style="background:rgba(255,255,255,0.03); padding:16px; border:1px solid #2c2c2c; border-radius:16px; margin-bottom:24px;">
                <p style="color:#666; font-size:12px; margin-bottom:4px; text-transform:uppercase; letter-spacing:1px;">Telegram ID</p>
                <code style="font-family:monospace; font-size:16px; color:#fff;">${user.telegram_id}</code>
            </div>

            <a href="/guys" class="btn">📱 Открыть мессенджер</a>
            <button onclick="logout()" class="btn btn-outline" style="margin-top:8px;">
                Выйти из аккаунта
            </button>
        </div>
    `;
}

function logout() {
    localStorage.removeItem(TELEGRAM_ID_KEY);
    window.location.href = '/';
}

// ===================== ЗАПУСК =====================
document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
