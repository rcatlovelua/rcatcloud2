<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Guys — Мессенджер</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0a;
    color: #e5e5e5;
    height: 100vh;
    height: 100dvh; /* Для мобильных с динамической высотой */
    display: flex;
    overflow: hidden;
    position: relative;
}

/* ===== САЙДБАР ===== */
.sidebar {
    width: 340px;
    min-width: 340px;
    background: #0f0f0f;
    border-right: 1px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.3s ease;
    z-index: 10;
}

.sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

.sidebar-header h1 {
    font-size: 20px;
    font-weight: 600;
}
.sidebar-header h1 span { color: #8b5cf6; }
.sidebar-header .back-btn {
    color: #666;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
}
.sidebar-header .back-btn:hover { color: #aaa; }

.search-box {
    padding: 12px 16px;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
}
.search-box input {
    width: 100%;
    padding: 10px 14px;
    background: #161616;
    border: 1px solid #222;
    border-radius: 10px;
    color: #e5e5e5;
    font-size: 14px;
    outline: none;
}
.search-box input:focus { border-color: #8b5cf6; }
.search-box input::placeholder { color: #555; }

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    -webkit-overflow-scrolling: touch;
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: 0.15s;
    border-left: 3px solid transparent;
    min-height: 60px;
}
.chat-item:active { background: #141414; }
.chat-item.active {
    background: #141414;
    border-left-color: #8b5cf6;
}

.chat-avatar {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    font-size: 16px;
    color: #aaa;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}
.chat-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.chat-avatar .online-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid #0f0f0f;
}
.chat-avatar .online-dot.online { background: #22c55e; }
.chat-avatar .online-dot.offline { background: #444; }

.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 500; font-size: 15px; color: #eee; }
.chat-last-msg {
    font-size: 13px;
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}
.chat-last-msg .sender { color: #8b5cf6; }

.chat-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
    margin-left: 8px;
}
.chat-time { font-size: 11px; color: #444; white-space: nowrap; }
.chat-unread {
    background: #8b5cf6;
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 40px;
    min-width: 20px;
    text-align: center;
}

/* ===== ЧАТ ===== */
.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0a0a0a;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
}

.chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0d0d0d;
    flex-shrink: 0;
    min-height: 56px;
}
.chat-header .chat-avatar { width: 36px; height: 36px; min-width: 36px; }
.chat-header-info { flex: 1; min-width: 0; }
.chat-header-info .name { font-weight: 500; font-size: 15px; }
.chat-header-info .status { font-size: 12px; color: #666; }
.chat-header-info .status.online { color: #22c55e; }
.chat-header .back-btn-mobile {
    display: none;
    background: none;
    border: none;
    color: #888;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
}

.messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
}

.message-row {
    display: flex;
    gap: 10px;
    padding: 4px 0;
    max-width: 100%;
}
.message-row .avatar {
    width: 30px;
    height: 30px;
    min-width: 30px;
    border-radius: 50%;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: #888;
    flex-shrink: 0;
    overflow: hidden;
}
.message-row .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.message-row .bubble {
    background: #141414;
    padding: 8px 12px;
    border-radius: 12px;
    max-width: 85%;
    word-break: break-word;
}
.message-row .bubble .sender-name {
    font-size: 11px;
    color: #8b5cf6;
    margin-bottom: 3px;
    font-weight: 500;
}
.message-row .bubble .text { font-size: 14px; line-height: 1.4; color: #e5e5e5; }
.message-row .bubble .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 10px;
    color: #555;
}
.message-row .bubble .meta .status.read { color: #22c55e; }
.message-row.own { flex-direction: row-reverse; }
.message-row.own .bubble { background: #1a1a2a; border: 1px solid #2a2a3a; }
.message-row.own .bubble .sender-name { color: #22c55e; }

/* ===== ИНПУТ ===== */
.input-area {
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid #1a1a1a;
    display: flex;
    gap: 10px;
    background: #0d0d0d;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
}
.input-area input {
    flex: 1;
    padding: 10px 16px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 40px;
    color: #e5e5e5;
    font-size: 15px;
    outline: none;
    min-height: 44px;
    max-height: 120px;
}
.input-area input:focus { border-color: #8b5cf6; }
.input-area input::placeholder { color: #555; }
.input-area button {
    padding: 10px 20px;
    background: #8b5cf6;
    border: none;
    border-radius: 40px;
    color: white;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    min-height: 44px;
    min-width: 52px;
    flex-shrink: 0;
}
.input-area button:active { transform: scale(0.95); }

.empty-state { color: #333; text-align: center; margin-top: 40px; font-size: 14px; }
.new-chat-btn {
    padding: 6px 14px;
    background: #8b5cf6;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
}
.new-chat-btn:active { opacity: 0.8; }

.error-container {
    text-align: center;
    padding: 30px 20px;
    border: 1px solid #2c2c2c;
    border-radius: 20px;
    max-width: 380px;
    margin: 20px;
}
.error-container .icon { font-size: 48px; margin-bottom: 16px; }
.error-container h2 { font-size: 20px; margin-bottom: 8px; }
.error-container p { color: #666; margin-bottom: 16px; font-size: 14px; }
.error-container .btn {
    display: inline-block;
    padding: 12px 28px;
    background: #8b5cf6;
    color: white;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 500;
}

/* Модалка */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
}
.modal h2 { font-size: 20px; margin-bottom: 16px; }
.modal input {
    width: 100%;
    padding: 12px 14px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
}
.modal input:focus { border-color: #8b5cf6; }
.modal .user-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
}
.modal .user-item:active { background: #1a1a1a; }
.modal .user-item .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
}
.modal .user-item .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.modal .close-btn {
    margin-top: 12px;
    padding: 10px;
    background: #2a2a2a;
    border: none;
    border-radius: 8px;
    color: #888;
    width: 100%;
    cursor: pointer;
    font-size: 14px;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 10px; }

/* ===== АДАПТИВ ===== */
@media (max-width: 768px) {
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 85%;
        max-width: 320px;
        min-width: auto;
        transform: translateX(-100%);
        z-index: 100;
        border-right: 1px solid #1a1a1a;
        box-shadow: 4px 0 30px rgba(0,0,0,0.8);
    }
    .sidebar.open {
        transform: translateX(0);
    }
    
    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.6);
        z-index: 99;
    }
    .sidebar-overlay.open {
        display: block;
    }
    
    .chat-header .back-btn-mobile {
        display: block;
    }
    
    .messages-container {
        padding: 12px;
    }
    
    .message-row .bubble {
        max-width: 90%;
    }
    
    .input-area {
        padding: 8px 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        gap: 8px;
    }
    .input-area input {
        padding: 8px 14px;
        font-size: 14px;
        min-height: 38px;
    }
    .input-area button {
        padding: 8px 16px;
        min-height: 38px;
        min-width: 44px;
        font-size: 14px;
    }
    
    .chat-header {
        padding: 10px 12px;
        min-height: 48px;
    }
    .chat-header .chat-avatar { width: 32px; height: 32px; min-width: 32px; }
    .chat-header-info .name { font-size: 14px; }
    .chat-header-info .status { font-size: 11px; }
}

@media (max-width: 400px) {
    .sidebar {
        width: 90%;
        max-width: 300px;
    }
    .chat-item {
        padding: 8px 12px;
        gap: 10px;
        min-height: 50px;
    }
    .chat-avatar {
        width: 38px;
        height: 38px;
        min-width: 38px;
    }
    .chat-name { font-size: 14px; }
    .chat-last-msg { font-size: 12px; }
    .message-row .bubble { padding: 6px 10px; }
    .message-row .bubble .text { font-size: 13px; }
}

/* Убираем выделение на мобильных */
* {
    -webkit-tap-highlight-color: transparent;
}

/* Скролл для сообщений */
.messages-container {
    scroll-behavior: smooth;
}
</style>
</head>
<body>

<!-- Оверлей для мобильного меню -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="app" style="display:none;width:100%;height:100vh;height:100dvh;">
    <!-- Сайдбар -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>Guys <span>✦</span></h1>
            <div style="display:flex;gap:6px;align-items:center;">
                <button class="new-chat-btn" onclick="openNewChatModal()">+</button>
                <a href="/" class="back-btn">←</a>
            </div>
        </div>
        <div class="search-box">
            <input id="searchInput" placeholder="Поиск чатов..." />
        </div>
        <div id="chatList" class="chat-list"></div>
    </div>

    <!-- Основной чат -->
    <div class="chat-main" id="chatMain">
        <div id="chatHeader" class="chat-header">
            <button class="back-btn-mobile" onclick="toggleSidebar()">☰</button>
            <div class="chat-avatar" id="chatHeaderAvatar">?</div>
            <div class="chat-header-info">
                <div class="name" id="chatHeaderName">Выберите чат</div>
                <div class="status" id="chatHeaderStatus">───</div>
            </div>
        </div>
        <div id="messagesContainer" class="messages-container">
            <div class="empty-state">👋 Выберите чат</div>
        </div>
        <div class="input-area" id="inputArea">
            <input id="msgInput" placeholder="Сообщение..." autocomplete="off" />
            <button id="sendBtn">➜</button>
        </div>
    </div>
</div>

<!-- Модалка -->
<div id="newChatModal" class="modal-overlay">
    <div class="modal">
        <h2>Новый чат</h2>
        <input id="searchUsersInput" placeholder="Поиск пользователей..." />
        <div id="userSearchResults" class="user-list" style="max-height:200px;overflow-y:auto;"></div>
        <button class="close-btn" onclick="closeNewChatModal()">Закрыть</button>
    </div>
</div>

<script>
// ============================================================
//  GUYS — МЕССЕНДЖЕР (МОБИЛЬНАЯ ВЕРСИЯ)
// ============================================================

const API_BASE = 'https://rcatcloud2.vercel.app/api/guys';
const TELEGRAM_ID_KEY = 'telegram_id';

// ===================== СОСТОЯНИЕ =====================
let currentUserId = null;
let currentUser = null;
let activeChatId = null;
let chats = [];
let messagesCache = {};
let allUsers = [];

// ===================== УТИЛИТЫ =====================
function getTelegramId() {
    return localStorage.getItem(TELEGRAM_ID_KEY);
}

function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function getInitials(name) {
    if (!name) return '?';
    return name.charAt(0).toUpperCase();
}

function getAvatarUrl(username) {
    return username ? `https://unavatar.io/telegram/${username}` : null;
}

// ===================== МОБИЛЬНОЕ МЕНЮ =====================
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
}

function closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
}

// ===================== API =====================
async function apiCall(action, method = 'GET', body = null) {
    const url = `${API_BASE}?action=${action}`;
    const options = {
        method,
        headers: { 'Content-Type': 'application/json' }
    };
    if (body) options.body = JSON.stringify(body);
    
    try {
        const res = await fetch(url, options);
        if (!res.ok) {
            console.error('API Error:', res.status);
            return { error: `HTTP ${res.status}` };
        }
        return await res.json();
    } catch (e) {
        console.error('Fetch Error:', e);
        return { error: e.message };
    }
}

// ===================== ЗАГРУЗКА =====================
async function loadData() {
    currentUserId = getTelegramId();
    
    if (!currentUserId) {
        showError('👻', 'Не авторизован', 'Войдите через Telegram в портале', '/Portal');
        return;
    }
    
    const userData = await apiCall(`getUser&id=${currentUserId}`);
    if (!userData.exists) {
        showError('❌', 'Профиль не найден', 'Создайте профиль в портале', '/Portal');
        return;
    }
    
    currentUser = {
        id: currentUserId,
        username: userData.username,
        first_name: userData.first_name,
        avatar: userData.avatar
    };
    
    document.getElementById('app').style.display = 'flex';
    
    allUsers = await apiCall('getUsers');
    if (!allUsers || !Array.isArray(allUsers)) allUsers = [];
    
    chats = allUsers
        .filter(u => String(u.telegram_id) !== String(currentUserId))
        .map(u => ({
            id: String(u.telegram_id),
            name: u.first_name || u.username,
            username: u.username,
            online: u.online || false,
            last_seen: u.last_seen,
            last_message: 'Нет сообщений',
            last_sender: null,
            last_sender_name: null,
            last_msg_time: null,
            unread: 0,
            avatar: u.avatar || getAvatarUrl(u.username)
        }));
    
    await apiCall('setOnline', 'POST', { telegram_id: currentUserId });
    
    await loadAllLastMessages();
    renderChatList();
    
    if (chats.length > 0) {
        await openChat(chats[0].id);
    }
    
    // Фокус на ввод для удобства
    setTimeout(() => {
        document.getElementById('msgInput')?.focus();
    }, 500);
}

async function loadAllLastMessages() {
    for (const chat of chats) {
        const msgs = await apiCall(`getMessages&chat_id=${chat.id}`);
        if (msgs && msgs.length > 0) {
            const lastMsg = msgs[msgs.length - 1];
            chat.last_message = lastMsg.text || 'Сообщение';
            chat.last_sender = lastMsg.sender_id;
            chat.last_sender_name = lastMsg.sender_name;
            chat.last_msg_time = lastMsg.created_at;
            messagesCache[chat.id] = msgs;
        }
    }
}

function showError(icon, title, message, link) {
    document.body.innerHTML = `
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0a;">
            <div class="error-container">
                <div class="icon">${icon}</div>
                <h2>${title}</h2>
                <p>${message}</p>
                <a href="${link}" class="btn">Перейти в портал</a>
            </div>
        </div>
    `;
}

// ===================== РЕНДЕР =====================
function renderChatList() {
    const container = document.getElementById('chatList');
    if (!chats || chats.length === 0) {
        container.innerHTML = `<div style="color:#333;padding:20px;text-align:center;font-size:14px;">Нет чатов. Начните новый!</div>`;
        return;
    }
    
    container.innerHTML = chats.map(chat => {
        const isActive = chat.id === activeChatId;
        const avatar = chat.avatar || getAvatarUrl(chat.username);
        const lastMsg = chat.last_message || 'Нет сообщений';
        const lastMsgDisplay = chat.last_sender && String(chat.last_sender) !== String(currentUserId)
            ? `<span class="sender">${chat.last_sender_name || 'Кто-то'}:</span> ${lastMsg}`
            : lastMsg;
        
        return `
            <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat('${chat.id}'); closeSidebar();">
                <div class="chat-avatar">
                    ${avatar ? `<img src="${avatar}" alt="${chat.name}" loading="lazy" />` : getInitials(chat.name)}
                    <span class="online-dot ${chat.online ? 'online' : 'offline'}"></span>
                </div>
                <div class="chat-info">
                    <div class="chat-name">${chat.name}</div>
                    <div class="chat-last-msg">${lastMsgDisplay}</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">${chat.last_msg_time ? formatTime(chat.last_msg_time) : ''}</div>
                    ${chat.unread > 0 ? `<div class="chat-unread">${chat.unread}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

function renderMessages(chatId) {
    const container = document.getElementById('messagesContainer');
    const msgs = messagesCache[chatId] || [];
    
    if (!chatId) {
        container.innerHTML = `<div class="empty-state">👋 Выберите чат</div>`;
        return;
    }
    
    if (msgs.length === 0) {
        container.innerHTML = `<div class="empty-state">💬 Нет сообщений. Напишите первым!</div>`;
        return;
    }
    
    container.innerHTML = msgs.map(msg => {
        const isOwn = String(msg.sender_id) === String(currentUserId);
        const readStatus = msg.read ? '✓✓' : '✓';
        const isRead = msg.read;
        const avatar = msg.avatar || getAvatarUrl(msg.sender_name);
        const senderName = msg.sender_name || msg.sender_id || 'Unknown';
        
        return `
            <div class="message-row ${isOwn ? 'own' : ''}">
                <div class="avatar">
                    ${avatar ? `<img src="${avatar}" alt="" loading="lazy" />` : getInitials(senderName)}
                </div>
                <div class="bubble">
                    ${!isOwn ? `<div class="sender-name">${senderName}</div>` : ''}
                    <div class="text">${msg.text || ''}</div>
                    <div class="meta">
                        <span>${formatTime(msg.created_at)}</span>
                        ${isOwn ? `<span class="status ${isRead ? 'read' : ''}">${readStatus}</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    container.scrollTop = container.scrollHeight;
}

function updateChatHeader(chatId) {
    const chat = chats.find(c => c.id === chatId);
    if (!chat) return;
    
    document.getElementById('chatHeaderName').textContent = chat.name;
    const avatar = chat.avatar || getAvatarUrl(chat.username);
    document.getElementById('chatHeaderAvatar').innerHTML = avatar 
        ? `<img src="${avatar}" alt="${chat.name}" loading="lazy" />` 
        : getInitials(chat.name);
    
    const statusEl = document.getElementById('chatHeaderStatus');
    if (chat.online) {
        statusEl.textContent = '🟢 Онлайн';
        statusEl.className = 'status online';
    } else {
        const lastSeen = chat.last_seen ? new Date(chat.last_seen) : null;
        statusEl.textContent = lastSeen 
            ? `⚫ Был(а) ${lastSeen.toLocaleString('ru-RU', { hour:'2-digit', minute:'2-digit' })}` 
            : '⚫ Не в сети';
        statusEl.className = 'status';
    }
}

// ===================== ОТКРЫТИЕ ЧАТА =====================
async function openChat(chatId) {
    if (!chatId) return;
    
    activeChatId = chatId;
    
    if (!messagesCache[chatId]) {
        const msgs = await apiCall(`getMessages&chat_id=${chatId}`);
        messagesCache[chatId] = msgs || [];
        
        const chat = chats.find(c => c.id === chatId);
        if (chat && messagesCache[chatId].length > 0) {
            const lastMsg = messagesCache[chatId][messagesCache[chatId].length - 1];
            chat.last_message = lastMsg.text || 'Сообщение';
            chat.last_sender = lastMsg.sender_id;
            chat.last_sender_name = lastMsg.sender_name;
            chat.last_msg_time = lastMsg.created_at;
        }
    }
    
    renderChatList();
    updateChatHeader(chatId);
    renderMessages(chatId);
    
    await apiCall('readChat', 'POST', { 
        chat_id: chatId, 
        receiver_id: currentUserId 
    });
    
    // Фокус на ввод после открытия чата
    setTimeout(() => {
        document.getElementById('msgInput')?.focus();
    }, 300);
}

// ===================== ОТПРАВКА =====================
async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !activeChatId) return;
    
    const newMsg = {
        sender_id: currentUserId,
        sender_name: currentUser?.first_name || currentUser?.username || 'Я',
        text: text,
        created_at: new Date().toISOString(),
        read: false,
        avatar: currentUser?.avatar
    };
    
    if (!messagesCache[activeChatId]) messagesCache[activeChatId] = [];
    messagesCache[activeChatId].push(newMsg);
    renderMessages(activeChatId);
    input.value = '';
    
    await apiCall('sendMessage', 'POST', {
        chat_id: activeChatId,
        sender_id: currentUserId,
        text: text
    });
    
    const chat = chats.find(c => c.id === activeChatId);
    if (chat) {
        chat.last_message = text;
        chat.last_sender = currentUserId;
        chat.last_sender_name = currentUser?.first_name || currentUser?.username;
        chat.last_msg_time = new Date().toISOString();
        renderChatList();
    }
    
    await apiCall('readChat', 'POST', { 
        chat_id: activeChatId, 
        receiver_id: currentUserId 
    });
    
    // Возвращаем фокус
    setTimeout(() => {
        document.getElementById('msgInput')?.focus();
    }, 100);
}

// ===================== НОВЫЙ ЧАТ =====================
function openNewChatModal() {
    document.getElementById('newChatModal').classList.add('active');
    renderUserSearch('');
    setTimeout(() => {
        document.getElementById('searchUsersInput')?.focus();
    }, 200);
}

function closeNewChatModal() {
    document.getElementById('newChatModal').classList.remove('active');
}

async function startNewChat(targetId) {
    const result = await apiCall('startChat', 'POST', {
        user_id: currentUserId,
        target_id: targetId
    });
    
    if (result.success) {
        closeNewChatModal();
        const target = allUsers.find(u => String(u.telegram_id) === String(targetId));
        if (target && !chats.find(c => c.id === targetId)) {
            chats.push({
                id: String(targetId),
                name: target.first_name || target.username,
                username: target.username,
                online: target.online || false,
                last_message: 'Нет сообщений',
                last_sender: null,
                last_sender_name: null,
                last_msg_time: null,
                avatar: target.avatar || getAvatarUrl(target.username)
            });
            renderChatList();
        }
        await openChat(targetId);
        closeSidebar();
    }
}

function renderUserSearch(query) {
    const container = document.getElementById('userSearchResults');
    const filtered = allUsers
        .filter(u => String(u.telegram_id) !== String(currentUserId))
        .filter(u => {
            const search = query.toLowerCase();
            return (u.first_name || '').toLowerCase().includes(search) ||
                   (u.username || '').toLowerCase().includes(search);
        });
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="color:#444;padding:12px;text-align:center;font-size:14px;">Пользователи не найдены</div>';
        return;
    }
    
    container.innerHTML = filtered.map(u => {
        const avatar = u.avatar || getAvatarUrl(u.username);
        return `
            <div class="user-item" onclick="startNewChat('${u.telegram_id}')">
                <div class="avatar">
                    ${avatar ? `<img src="${avatar}" alt="${u.first_name || u.username}" loading="lazy" />` : getInitials(u.first_name || u.username)}
                </div>
                <div>
                    <div style="font-weight:500;font-size:14px;">${u.first_name || u.username}</div>
                    <div style="font-size:12px;color:#666;">@${u.username}</div>
                </div>
            </div>
        `;
    }).join('');
}

// ===================== ИНИЦИАЛИЗАЦИЯ =====================
document.addEventListener('DOMContentLoaded', loadData);

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
    }
});

// При фокусе на инпуте — скроллим вниз
document.getElementById('msgInput').addEventListener('focus', () => {
    setTimeout(() => {
        const container = document.getElementById('messagesContainer');
        container.scrollTop = container.scrollHeight;
    }, 300);
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const filtered = chats.filter(c => 
        c.name.toLowerCase().includes(query) || 
        (c.username || '').toLowerCase().includes(query)
    );
    const container = document.getElementById('chatList');
    if (filtered.length === 0) {
        container.innerHTML = `<div style="color:#333;padding:20px;text-align:center;font-size:14px;">Ничего не найдено</div>`;
        return;
    }
    container.innerHTML = filtered.map(chat => {
        const isActive = chat.id === activeChatId;
        const avatar = chat.avatar || getAvatarUrl(chat.username);
        const lastMsg = chat.last_message || 'Нет сообщений';
        const lastMsgDisplay = chat.last_sender && String(chat.last_sender) !== String(currentUserId)
            ? `<span class="sender">${chat.last_sender_name || 'Кто-то'}:</span> ${lastMsg}`
            : lastMsg;
        
        return `
            <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat('${chat.id}'); closeSidebar();">
                <div class="chat-avatar">
                    ${avatar ? `<img src="${avatar}" alt="${chat.name}" loading="lazy" />` : getInitials(chat.name)}
                    <span class="online-dot ${chat.online ? 'online' : 'offline'}"></span>
                </div>
                <div class="chat-info">
                    <div class="chat-name">${chat.name}</div>
                    <div class="chat-last-msg">${lastMsgDisplay}</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">${chat.last_msg_time ? formatTime(chat.last_msg_time) : ''}</div>
                    ${chat.unread > 0 ? `<div class="chat-unread">${chat.unread}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
});

document.getElementById('searchUsersInput').addEventListener('input', (e) => {
    renderUserSearch(e.target.value);
});

window.addEventListener('beforeunload', () => {
    if (currentUserId) {
        navigator.sendBeacon('https://rcatcloud2.vercel.app/api/guys?action=setOffline', 
            JSON.stringify({ telegram_id: currentUserId })
        );
    }
});

// Realtime обновление
setInterval(async () => {
    try {
        const users = await apiCall('getUsers');
        if (users && Array.isArray(users)) {
            allUsers = users;
            chats.forEach(chat => {
                const user = users.find(u => String(u.telegram_id) === String(chat.id));
                if (user) {
                    chat.online = user.online || false;
                    chat.last_seen = user.last_seen;
                    chat.avatar = user.avatar || getAvatarUrl(user.username);
                }
            });
            renderChatList();
            if (activeChatId) updateChatHeader(activeChatId);
        }
    } catch (e) { /* ignore */ }
}, 5000);

// Исправление для клавиатуры на мобильных
// При открытии клавиатуры скроллим к инпуту
if ('visualViewport' in window) {
    let lastHeight = window.visualViewport.height;
    window.visualViewport.addEventListener('resize', () => {
        const currentHeight = window.visualViewport.height;
        if (currentHeight < lastHeight) {
            // Клавиатура открылась
            setTimeout(() => {
                document.getElementById('msgInput')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;
            }, 200);
        }
        lastHeight = currentHeight;
    });
}
</script>
</body>
