<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guys — Мессенджер</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0a;
    color: #e5e5e5;
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* ===== САЙДБАР ===== */
.sidebar {
    width: 340px;
    background: #0f0f0f;
    border-right: 1px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar-header {
    padding: 20px 24px;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.sidebar-header h1 {
    font-size: 22px;
    font-weight: 600;
}
.sidebar-header h1 span { color: #8b5cf6; }
.sidebar-header .back-btn {
    color: #666;
    text-decoration: none;
    font-size: 13px;
}
.sidebar-header .back-btn:hover { color: #aaa; }

.search-box {
    padding: 16px 20px;
    border-bottom: 1px solid #1a1a1a;
}
.search-box input {
    width: 100%;
    padding: 10px 16px;
    background: #161616;
    border: 1px solid #222;
    border-radius: 10px;
    color: #e5e5e5;
    font-size: 14px;
    outline: none;
}
.search-box input:focus { border-color: #8b5cf6; }

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    cursor: pointer;
    transition: 0.15s;
    border-left: 2px solid transparent;
}
.chat-item:hover { background: #141414; }
.chat-item.active {
    background: #141414;
    border-left-color: #8b5cf6;
}

.chat-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    font-size: 16px;
    color: #aaa;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}
.chat-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.chat-avatar .online-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid #0f0f0f;
}
.chat-avatar .online-dot.online { background: #22c55e; }
.chat-avatar .online-dot.offline { background: #444; }

.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 500; font-size: 15px; color: #eee; }
.chat-last-msg {
    font-size: 13px;
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}
.chat-last-msg .sender { color: #8b5cf6; }

.chat-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
}
.chat-time { font-size: 11px; color: #444; }
.chat-unread {
    background: #8b5cf6;
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 40px;
    min-width: 20px;
    text-align: center;
}

/* ===== ЧАТ ===== */
.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0a0a0a;
    min-width: 0;
}

.chat-header {
    padding: 16px 28px;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #0d0d0d;
}
.chat-header .chat-avatar { width: 38px; height: 38px; }
.chat-header-info { flex: 1; }
.chat-header-info .name { font-weight: 500; font-size: 16px; }
.chat-header-info .status { font-size: 13px; color: #666; }
.chat-header-info .status.online { color: #22c55e; }

.messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.message-row {
    display: flex;
    gap: 12px;
    padding: 6px 0;
}
.message-row .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    color: #888;
    flex-shrink: 0;
    overflow: hidden;
}
.message-row .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.message-row .bubble {
    background: #141414;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 70%;
    word-break: break-word;
}
.message-row .bubble .sender-name {
    font-size: 12px;
    color: #8b5cf6;
    margin-bottom: 4px;
    font-weight: 500;
}
.message-row .bubble .text { font-size: 15px; line-height: 1.4; color: #e5e5e5; }
.message-row .bubble .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 11px;
    color: #555;
}
.message-row .bubble .meta .status.read { color: #22c55e; }
.message-row.own { flex-direction: row-reverse; }
.message-row.own .bubble { background: #1a1a2a; border: 1px solid #2a2a3a; }

.input-area {
    padding: 16px 28px;
    border-top: 1px solid #1a1a1a;
    display: flex;
    gap: 12px;
    background: #0d0d0d;
}
.input-area input {
    flex: 1;
    padding: 12px 18px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 40px;
    color: #e5e5e5;
    font-size: 15px;
    outline: none;
}
.input-area input:focus { border-color: #8b5cf6; }
.input-area button {
    padding: 12px 24px;
    background: #8b5cf6;
    border: none;
    border-radius: 40px;
    color: white;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}
.input-area button:hover { background: #7c4df0; }

.empty-state { color: #333; text-align: center; margin-top: 60px; font-size: 15px; }
.new-chat-btn {
    padding: 8px 16px;
    background: #8b5cf6;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-weight: 500;
}
.new-chat-btn:hover { background: #7c4df0; }

.error-container {
    text-align: center;
    padding: 40px;
    border: 1px solid #2c2c2c;
    border-radius: 24px;
    max-width: 400px;
}
.error-container .icon { font-size: 60px; margin-bottom: 20px; }
.error-container h2 { margin-bottom: 12px; }
.error-container p { color: #666; margin-bottom: 20px; }
.error-container .btn {
    display: inline-block;
    padding: 12px 24px;
    background: #8b5cf6;
    color: white;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 500;
}
.error-container .btn:hover { background: #7c4df0; }

/* Модалка */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}
.modal-overlay.active { display: flex; }
.modal {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 90%;
}
.modal h2 { margin-bottom: 20px; }
.modal input {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    margin-bottom: 12px;
}
.modal .user-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
}
.modal .user-item:hover { background: #1a1a1a; }
.modal .user-item .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
}
.modal .close-btn {
    margin-top: 12px;
    padding: 10px;
    background: #2a2a2a;
    border: none;
    border-radius: 8px;
    color: #888;
    width: 100%;
    cursor: pointer;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 10px; }
</style>
</head>
<body>

<div id="app" style="display:none;width:100%;height:100vh;">
    <!-- Сайдбар -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Guys <span>✦</span></h1>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="new-chat-btn" onclick="openNewChatModal()">+</button>
                <a href="/" class="back-btn">←</a>
            </div>
        </div>
        <div class="search-box">
            <input id="searchInput" placeholder="Поиск чатов..." />
        </div>
        <div id="chatList" class="chat-list"></div>
    </div>

    <!-- Основной чат -->
    <div class="chat-main">
        <div id="chatHeader" class="chat-header">
            <div class="chat-avatar" id="chatHeaderAvatar">?</div>
            <div class="chat-header-info">
                <div class="name" id="chatHeaderName">Выберите чат</div>
                <div class="status" id="chatHeaderStatus">───</div>
            </div>
        </div>
        <div id="messagesContainer" class="messages-container">
            <div class="empty-state">👋 Выберите чат</div>
        </div>
        <div class="input-area">
            <input id="msgInput" placeholder="Сообщение..." />
            <button id="sendBtn">➜</button>
        </div>
    </div>
</div>

<!-- Модалка -->
<div id="newChatModal" class="modal-overlay">
    <div class="modal">
        <h2>Новый чат</h2>
        <input id="searchUsersInput" placeholder="Поиск пользователей..." />
        <div id="userSearchResults" class="user-list" style="max-height:200px;overflow-y:auto;"></div>
        <button class="close-btn" onclick="closeNewChatModal()">Закрыть</button>
    </div>
</div>

<script>
// ============================================================
//  GUYS — МЕССЕНДЖЕР (ИСПРАВЛЕННАЯ ВЕРСИЯ)
// ============================================================

const API_BASE = 'https://rcatcloud2.vercel.app/api/guys';
const TELEGRAM_ID_KEY = 'telegram_id';

// ===================== СОСТОЯНИЕ =====================
let currentUserId = null;
let currentUser = null;
let activeChatId = null;
let chats = [];
let messagesCache = {};  // кэш сообщений по chat_id
let allUsers = [];

// ===================== УТИЛИТЫ =====================
function getTelegramId() {
    return localStorage.getItem(TELEGRAM_ID_KEY);
}

function getChatId(user1, user2) {
    return [String(user1), String(user2)].sort().join('_');
}

function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function getInitials(name) {
    if (!name) return '?';
    return name.charAt(0).toUpperCase();
}

function getAvatarUrl(username) {
    return username ? `https://unavatar.io/telegram/${username}` : null;
}

// ===================== API =====================
async function apiCall(action, method = 'GET', body = null) {
    const url = `${API_BASE}?action=${action}`;
    const options = {
        method,
        headers: { 'Content-Type': 'application/json' }
    };
    if (body) options.body = JSON.stringify(body);
    
    try {
        const res = await fetch(url, options);
        if (!res.ok) {
            console.error('API Error:', res.status);
            return { error: `HTTP ${res.status}` };
        }
        return await res.json();
    } catch (e) {
        console.error('Fetch Error:', e);
        return { error: e.message };
    }
}

// ===================== ЗАГРУЗКА =====================
async function loadData() {
    currentUserId = getTelegramId();
    
    if (!currentUserId) {
        showError('👻', 'Не авторизован', 'Войдите через Telegram в портале', '/');
        return;
    }
    
    const userData = await apiCall(`getUser&id=${currentUserId}`);
    if (!userData.exists) {
        showError('❌', 'Профиль не найден', 'Создайте профиль в портале', '/');
        return;
    }
    
    currentUser = {
        id: currentUserId,
        username: userData.username,
        first_name: userData.first_name,
        avatar: userData.avatar
    };
    
    document.getElementById('app').style.display = 'flex';
    
    allUsers = await apiCall('getUsers');
    if (!allUsers || !Array.isArray(allUsers)) allUsers = [];
    
    // Формируем чаты
    chats = allUsers
        .filter(u => String(u.telegram_id) !== String(currentUserId))
        .map(u => ({
            id: String(u.telegram_id),
            name: u.first_name || u.username,
            username: u.username,
            online: u.online || false,
            last_seen: u.last_seen,
            last_message: '',
            last_sender: '',
            unread: 0,
            avatar: u.avatar || getAvatarUrl(u.username)
        }));
    
    // Ставим онлайн
    await apiCall('setOnline', 'POST', { telegram_id: currentUserId });
    
    renderChatList();
    
    // Открываем первый чат
    if (chats.length > 0) {
        await openChat(chats[0].id);
    }
}

function showError(icon, title, message, link) {
    document.body.innerHTML = `
        <div class="error-container">
            <div class="icon">${icon}</div>
            <h2>${title}</h2>
            <p>${message}</p>
            <a href="${link}" class="btn">Перейти в портал</a>
        </div>
    `;
}

// ===================== РЕНДЕР =====================
function renderChatList() {
    const container = document.getElementById('chatList');
    
    if (!chats || chats.length === 0) {
        container.innerHTML = `<div style="color:#333;padding:20px;text-align:center;">Нет чатов. Начните новый!</div>`;
        return;
    }
    
    container.innerHTML = chats.map(chat => {
        const isActive = chat.id === activeChatId;
        const avatar = chat.avatar || getAvatarUrl(chat.username);
        const lastMsg = chat.last_message || 'Нет сообщений';
        const lastMsgDisplay = chat.last_sender && chat.last_sender !== currentUserId
            ? `<span class="sender">${chat.last_sender_name || 'Кто-то'}:</span> ${lastMsg}`
            : lastMsg;
        
        return `
            <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat('${chat.id}')">
                <div class="chat-avatar">
                    ${avatar ? `<img src="${avatar}" alt="${chat.name}" />` : getInitials(chat.name)}
                    <span class="online-dot ${chat.online ? 'online' : 'offline'}"></span>
                </div>
                <div class="chat-info">
                    <div class="chat-name">${chat.name}</div>
                    <div class="chat-last-msg">${lastMsgDisplay}</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">${chat.last_msg_time ? formatTime(chat.last_msg_time) : ''}</div>
                    ${chat.unread > 0 ? `<div class="chat-unread">${chat.unread}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

function renderMessages(chatId) {
    const container = document.getElementById('messagesContainer');
    const msgs = messagesCache[chatId] || [];
    
    if (!chatId) {
        container.innerHTML = `<div class="empty-state">👋 Выберите чат</div>`;
        return;
    }
    
    if (msgs.length === 0) {
        container.innerHTML = `<div class="empty-state">💬 Нет сообщений. Напишите первым!</div>`;
        return;
    }
    
    container.innerHTML = msgs.map(msg => {
        const isOwn = String(msg.sender_id) === String(currentUserId);
        const readStatus = msg.read ? '✓✓' : '✓';
        const isRead = msg.read;
        const avatar = msg.avatar || getAvatarUrl(msg.sender_name);
        const senderName = msg.sender_name || msg.sender_id || 'Unknown';
        
        return `
            <div class="message-row ${isOwn ? 'own' : ''}">
                <div class="avatar">
                    ${avatar ? `<img src="${avatar}" alt="" />` : getInitials(senderName)}
                </div>
                <div class="bubble">
                    ${!isOwn ? `<div class="sender-name">${senderName}</div>` : ''}
                    <div class="text">${msg.text || ''}</div>
                    <div class="meta">
                        <span>${formatTime(msg.created_at)}</span>
                        ${isOwn ? `<span class="status ${isRead ? 'read' : ''}">${readStatus}</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    container.scrollTop = container.scrollHeight;
}

function updateChatHeader(chatId) {
    const chat = chats.find(c => c.id === chatId);
    if (!chat) return;
    
    document.getElementById('chatHeaderName').textContent = chat.name;
    const avatar = chat.avatar || getAvatarUrl(chat.username);
    document.getElementById('chatHeaderAvatar').innerHTML = avatar 
        ? `<img src="${avatar}" alt="${chat.name}" />` 
        : getInitials(chat.name);
    
    const statusEl = document.getElementById('chatHeaderStatus');
    if (chat.online) {
        statusEl.textContent = '🟢 Онлайн';
        statusEl.className = 'status online';
    } else {
        const lastSeen = chat.last_seen ? new Date(chat.last_seen) : null;
        statusEl.textContent = lastSeen 
            ? `⚫ Был(а) ${lastSeen.toLocaleString('ru-RU', { hour:'2-digit', minute:'2-digit' })}` 
            : '⚫ Не в сети';
        statusEl.className = 'status';
    }
}

// ===================== ОТКРЫТИЕ ЧАТА =====================
async function openChat(chatId) {
    if (!chatId) return;
    
    // Обновляем активный чат
    activeChatId = chatId;
    
    // Обновляем список чатов (подсветка активного)
    renderChatList();
    
    // Обновляем хедер
    updateChatHeader(chatId);
    
    // Загружаем сообщения, если их нет в кэше
    if (!messagesCache[chatId]) {
        const msgs = await apiCall(`getMessages&chat_id=${chatId}`);
        messagesCache[chatId] = msgs || [];
    }
    
    renderMessages(chatId);
    
    // Отмечаем прочитанным
    await apiCall('readChat', 'POST', { 
        chat_id: chatId, 
        receiver_id: currentUserId 
    });
}

// ===================== ОТПРАВКА =====================
async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !activeChatId) return;
    
    // Оптимистично добавляем
    const newMsg = {
        sender_id: currentUserId,
        sender_name: currentUser?.first_name || currentUser?.username || 'Я',
        text: text,
        created_at: new Date().toISOString(),
        read: false,
        avatar: currentUser?.avatar
    };
    
    if (!messagesCache[activeChatId]) messagesCache[activeChatId] = [];
    messagesCache[activeChatId].push(newMsg);
    renderMessages(activeChatId);
    input.value = '';
    
    // Отправляем на сервер
    await apiCall('sendMessage', 'POST', {
        chat_id: activeChatId,
        sender_id: currentUserId,
        text: text
    });
    
    // Обновляем последнее сообщение в списке чатов
    const chat = chats.find(c => c.id === activeChatId);
    if (chat) {
        chat.last_message = text;
        chat.last_sender = currentUserId;
        chat.last_sender_name = currentUser?.first_name || currentUser?.username;
        chat.last_msg_time = new Date().toISOString();
        renderChatList();
    }
    
    // Отмечаем прочитанным
    await apiCall('readChat', 'POST', { 
        chat_id: activeChatId, 
        receiver_id: currentUserId 
    });
}

// ===================== НОВЫЙ ЧАТ =====================
function openNewChatModal() {
    document.getElementById('newChatModal').classList.add('active');
    renderUserSearch('');
}

function closeNewChatModal() {
    document.getElementById('newChatModal').classList.remove('active');
}

async function startNewChat(targetId) {
    const result = await apiCall('startChat', 'POST', {
        user_id: currentUserId,
        target_id: targetId
    });
    
    if (result.success) {
        closeNewChatModal();
        const target = allUsers.find(u => String(u.telegram_id) === String(targetId));
        if (target && !chats.find(c => c.id === targetId)) {
            chats.push({
                id: String(targetId),
                name: target.first_name || target.username,
                username: target.username,
                online: target.online || false,
                avatar: target.avatar || getAvatarUrl(target.username)
            });
            renderChatList();
        }
        await openChat(targetId);
    }
}

function renderUserSearch(query) {
    const container = document.getElementById('userSearchResults');
    const filtered = allUsers
        .filter(u => String(u.telegram_id) !== String(currentUserId))
        .filter(u => {
            const search = query.toLowerCase();
            return (u.first_name || '').toLowerCase().includes(search) ||
                   (u.username || '').toLowerCase().includes(search);
        });
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="color:#444;padding:12px;text-align:center;">Пользователи не найдены</div>';
        return;
    }
    
    container.innerHTML = filtered.map(u => {
        const avatar = u.avatar || getAvatarUrl(u.username);
        return `
            <div class="user-item" onclick="startNewChat('${u.telegram_id}')">
                <div class="avatar">
                    ${avatar ? `<img src="${avatar}" alt="${u.first_name || u.username}" />` : getInitials(u.first_name || u.username)}
                </div>
                <div>
                    <div style="font-weight:500;">${u.first_name || u.username}</div>
                    <div style="font-size:12px;color:#666;">@${u.username}</div>
                </div>
            </div>
        `;
    }).join('');
}

// ===================== ИНИЦИАЛИЗАЦИЯ =====================
document.addEventListener('DOMContentLoaded', loadData);

// Кнопка отправки
document.getElementById('sendBtn').addEventListener('click', sendMessage);

// Enter для отправки
document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// Поиск чатов
document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const filtered = chats.filter(c => 
        c.name.toLowerCase().includes(query) || 
        (c.username || '').toLowerCase().includes(query)
    );
    const container = document.getElementById('chatList');
    if (filtered.length === 0) {
        container.innerHTML = `<div style="color:#333;padding:20px;text-align:center;">Ничего не найдено</div>`;
        return;
    }
    container.innerHTML = filtered.map(chat => {
        const isActive = chat.id === activeChatId;
        const avatar = chat.avatar || getAvatarUrl(chat.username);
        const lastMsg = chat.last_message || 'Нет сообщений';
        const lastMsgDisplay = chat.last_sender && chat.last_sender !== currentUserId
            ? `<span class="sender">${chat.last_sender_name || 'Кто-то'}:</span> ${lastMsg}`
            : lastMsg;
        
        return `
            <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat('${chat.id}')">
                <div class="chat-avatar">
                    ${avatar ? `<img src="${avatar}" alt="${chat.name}" />` : getInitials(chat.name)}
                    <span class="online-dot ${chat.online ? 'online' : 'offline'}"></span>
                </div>
                <div class="chat-info">
                    <div class="chat-name">${chat.name}</div>
                    <div class="chat-last-msg">${lastMsgDisplay}</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">${chat.last_msg_time ? formatTime(chat.last_msg_time) : ''}</div>
                    ${chat.unread > 0 ? `<div class="chat-unread">${chat.unread}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
});

// Поиск пользователей в модалке
document.getElementById('searchUsersInput').addEventListener('input', (e) => {
    renderUserSearch(e.target.value);
});

// При закрытии страницы — офлайн
window.addEventListener('beforeunload', () => {
    if (currentUserId) {
        navigator.sendBeacon('https://rcatcloud2.vercel.app/api/guys?action=setOffline', 
            JSON.stringify({ telegram_id: currentUserId })
        );
    }
});

// Realtime обновление статусов
setInterval(async () => {
    try {
        const users = await apiCall('getUsers');
        if (users && Array.isArray(users)) {
            allUsers = users;
            chats.forEach(chat => {
                const user = users.find(u => String(u.telegram_id) === String(chat.id));
                if (user) {
                    chat.online = user.online || false;
                    chat.last_seen = user.last_seen;
                    chat.avatar = user.avatar || getAvatarUrl(user.username);
                }
            });
            renderChatList();
            if (activeChatId) updateChatHeader(activeChatId);
        }
    } catch (e) { /* ignore */ }
}, 5000);
</script>
</body>
