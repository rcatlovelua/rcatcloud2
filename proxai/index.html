<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxAI - Chat System</title>

    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8cff7a;
            --primary-dim: rgba(140, 255, 122, 0.15);
            --primary-glow: rgba(140, 255, 122, 0.3);
            --bg-dark: #0a0f0a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border: rgba(140, 255, 122, 0.2);
            --text-primary: #e4ffe4;
            --text-secondary: rgba(228, 255, 228, 0.6);
            --shadow-glow: 0 0 30px rgba(140, 255, 122, 0.1);
        }

        body {
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            color: var(--text-primary);
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 30% 30%, rgba(15, 31, 15, 0.8), #000000 70%),
                radial-gradient(circle at 70% 60%, rgba(0, 255, 100, 0.05), transparent 50%);
            overflow-x: hidden;
            line-height: 1.6;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 100, 0.08), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 200, 100, 0.05), transparent 50%);
            pointer-events: none;
            animation: bgPulse 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .screen {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* Login Screen */
        .login-screen {
            justify-content: center;
            align-items: center;
        }

        .login-card {
            padding: 48px;
            border-radius: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            width: 440px;
            max-width: 90%;
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 56px;
            color: var(--primary);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-text {
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            color: var(--primary);
            text-shadow: 0 0 40px var(--primary-glow);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 8px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
            z-index: 1;
            transition: color 0.3s;
        }

        .input-field {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
            color: var(--primary);
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .input-group:focus-within i {
            color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--primary-glow);
            background: rgba(140, 255, 122, 0.1);
            color: var(--primary);
            font-family: 'Unbounded', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(140, 255, 122, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: rgba(140, 255, 122, 0.2);
            box-shadow: 0 0 30px var(--primary-glow);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-small {
            width: auto;
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 20px;
            padding: 8px;
            transition: all 0.3s;
            border-radius: 8px;
        }

        .btn-icon:hover {
            color: var(--primary);
            background: var(--primary-dim);
        }

        .links {
            text-align: center;
            margin-top: 24px;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .links a:hover {
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            display: none;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-message.show {
            display: block;
        }

        /* Chat Screen */
        .chat-screen {
            height: 100vh;
        }

        .chat-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-family: 'Unbounded', sans-serif;
            font-size: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .user-avatar i {
            font-size: 36px;
            color: var(--primary);
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-details #username {
            font-weight: 600;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        .badge.plus {
            background: rgba(140, 255, 122, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary-glow);
        }

        .badge.free {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .model-selector {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .model-selector h3 {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .select-model {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--primary);
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .select-model:focus {
            outline: none;
            border-color: var(--primary);
        }

        .select-model option {
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        .btn-new-chat {
            margin: 16px 20px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(140, 255, 122, 0.05);
            color: var(--primary);
            font-family: 'Unbounded', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-new-chat:hover {
            background: rgba(140, 255, 122, 0.15);
            border-color: var(--primary-glow);
        }

        .btn-logout {
            margin: auto 20px 20px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 68, 68, 0.3);
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            font-family: 'Unbounded', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background: rgba(255, 68, 68, 0.2);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 15, 10, 0.5);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(10px);
        }

        .chat-header h3 {
            flex: 1;
            font-family: 'Unbounded', sans-serif;
            font-size: 14px;
            color: var(--primary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            margin: auto;
            animation: fadeInUp 0.6s ease;
        }

        .welcome-icon i {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-message h2 {
            font-family: 'Unbounded', sans-serif;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .welcome-message p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-action {
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action:hover {
            background: var(--primary-dim);
            border-color: var(--primary-glow);
            transform: translateY(-2px);
        }

        .message {
            max-width: 80%;
            padding: 16px;
            border-radius: 16px;
            line-height: 1.6;
            animation: messageSlide 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: rgba(140, 255, 122, 0.15);
            border: 1px solid var(--primary-glow);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: var(--bg-card);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
            align-self: center;
            font-size: 13px;
        }

        .typing-indicator {
            display: none;
            padding: 16px;
            align-self: flex-start;
            animation: messageSlide 0.3s ease;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-container textarea {
            flex: 1;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
            color: var(--primary);
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            transition: all 0.3s;
        }

        .input-container textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .input-container textarea::placeholder {
            color: var(--text-secondary);
        }

        .btn-send {
            padding: 14px;
            border-radius: 50%;
            border: 1px solid var(--primary-glow);
            background: rgba(140, 255, 122, 0.1);
            color: var(--primary);
            cursor: pointer;
            transition: all 0.3s;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: rgba(140, 255, 122, 0.2);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.05);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 4px;
        }

        .char-count {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .model-badge {
            font-size: 11px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -300px;
                top: 0;
                bottom: 0;
                z-index: 100;
            }

            .sidebar.open {
                transform: translateX(300px);
            }

            .message {
                max-width: 90%;
            }

            .login-card {
                padding: 32px 24px;
            }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(140, 255, 122, 0.2);
            border: 1px solid var(--primary-glow);
            padding: 12px 20px;
            border-radius: 12px;
            color: var(--primary);
            font-family: 'Nunito', sans-serif;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            backdrop-filter: blur(10px);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen login-screen active">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <div class="logo-text">ProxAI</div>
                <p class="subtitle">Chat with AI models</p>
            </div>

            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="telegramId" class="input-field" placeholder="Telegram ID" autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="input-field" placeholder="Password" autocomplete="off">
            </div>

            <button class="btn" onclick="login()" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                Sign In
            </button>

            <div class="links">
                <a href="https://orrcs.vercel.app/Portal/TelegramAuth/login.html" target="_blank">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </a>
            </div>

            <div class="error-message" id="loginError"></div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="screen chat-screen">
        <div class="chat-container">
            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2><i class="fas fa-brain"></i> ProxAI</h2>
                    <button class="btn-icon" onclick="toggleSidebar()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="user-details">
                        <span id="username">User</span>
                        <span id="userStatus" class="badge free">Free</span>
                    </div>
                </div>

                <div class="model-selector">
                    <h3>AI Model</h3>
                    <select id="modelSelect" class="select-model" onchange="changeModel()">
                        <option value="">Select Model...</option>
                    </select>
                </div>

                <button class="btn-new-chat" onclick="newChat()">
                    <i class="fas fa-plus"></i>
                    New Chat
                </button>

                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>

            <!-- Main Chat -->
            <div class="main-chat">
                <div class="chat-header">
                    <button class="btn-icon" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h3 id="currentModel">Select a model</h3>
                    <button class="btn-icon" onclick="clearChat()">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>

                <div class="messages-container" id="messages">
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-icon">
                            <i class="fas fa-robot"></i>
                        </div>
                        <h2>Welcome to ProxAI!</h2>
                        <p>Select a model and start chatting</p>
                        <div class="quick-actions">
                            <button class="quick-action" onclick="quickPrompt('Explain your capabilities')">
                                <i class="fas fa-star"></i> Capabilities
                            </button>
                            <button class="quick-action" onclick="quickPrompt('Write a Python code example')">
                                <i class="fas fa-code"></i> Code
                            </button>
                            <button class="quick-action" onclick="quickPrompt('Explain what API is')">
                                <i class="fas fa-question"></i> Explain
                            </button>
                        </div>
                    </div>

                    <div class="typing-indicator" id="typingIndicator">
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-container">
                        <textarea id="messageInput" placeholder="Type your message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                        <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span class="char-count">
                            <span id="charCount">0</span> / 4000
                        </span>
                        <span class="model-badge" id="modelBadge">
                            <i class="fas fa-circle" style="font-size: 6px;"></i>
                            No model
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

   <script>
    // Configuration
    const API_BASE = window.location.origin; // Автоматически использует текущий домен Vercel

    // State
    let currentUser = null;
    let currentModel = null;
    let chatHistory = [];

    // Models configuration
    const MODELS = [
        {
            id: 'gemini-2.0-flash',
            name: 'Gemini 2.0 Flash',
            provider: 'gemini',
            icon: 'fa-google',
            description: 'Fast Google AI model'
        },
        {
            id: 'gemini-2.0-pro',
            name: 'Gemini 2.0 Pro',
            provider: 'gemini',
            icon: 'fa-google',
            description: 'Advanced Google AI model',
            plus: true

        },
        {

            name: 'Gemini 1.5 Pro',
            provider: 'gemini',
            icon: 'fa-google',
            description: 'Previous gen advanced model',
            plus: true
        },
        {
            id: 'gpt-4o-mini',
            name: 'GPT-4o Mini',
            provider: 'llm7',
            icon: 'fa-robot',
            description: 'OpenAI fast model via LLM7'
        },
        {
            id: 'gpt-4o',
            name: 'GPT-4o',
            provider: 'llm7',
            icon: 'fa-robot',
            description: 'OpenAI advanced model via LLM7',
            plus: true
        },
        {
            id: 'claude-3.5-sonnet',
            name: 'Claude 3.5 Sonnet',
            provider: 'llm7',
            icon: 'fa-robot',
            description: 'Anthropic AI via LLM7',
            plus: true
        },
        {
            id: 'claude-3-haiku',
            name: 'Claude 3 Haiku',
            provider: 'llm7',
            icon: 'fa-robot',
            description: 'Fast Anthropic AI via LLM7'
        },
        {
            id: 'gemini-3-flash-preview',
            name: 'Gemini 3 Flash',
            provider: 'gemini',
            icon: 'fa-google',
            description: 'Gemini Flash 3.0'
        }
    ];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            try {
                currentUser = JSON.parse(savedUser);
                showChatScreen();
            } catch(e) {
                localStorage.removeItem('currentUser');
            }
        }

        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
            document.getElementById('charCount').textContent = textarea.value.length;
        });

        populateModels();
    });

    function populateModels() {
        const select = document.getElementById('modelSelect');
        MODELS.forEach(model => {
            if (model.plus && (!currentUser || !currentUser.has_plus)) {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = `${model.name} 🔒`;
                option.disabled = true;
                select.appendChild(option);
            } else {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = model.name;
                select.appendChild(option);
            }
        });
    }

    // Auth functions
    async function login() {
        const id = document.getElementById('telegramId').value.trim();
        const pass = document.getElementById('password').value.trim();
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        if (!id || !pass) {
            showError('Please fill in all fields');
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
        loginError.classList.remove('show');

        try {
            const response = await fetch(`${API_BASE}/api/auth`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, pass })
            });

            const data = await response.json();

            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showChatScreen();
            } else {
                showError(data.error || 'Authentication failed');
            }
        } catch (error) {
            showError('Connection error: ' + error.message);
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        }
    }

    function showError(message) {
        const loginError = document.getElementById('loginError');
        loginError.textContent = message;
        loginError.classList.add('show');
        setTimeout(() => loginError.classList.remove('show'), 3000);
    }

    function showChatScreen() {
        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('chatScreen').classList.add('active');
        
        document.getElementById('username').textContent = currentUser.username;
        const statusBadge = document.getElementById('userStatus');
        if (currentUser.has_plus) {
            statusBadge.textContent = 'Plus';
            statusBadge.className = 'badge plus';
        } else {
            statusBadge.textContent = 'Free';
            statusBadge.className = 'badge free';
        }

        document.getElementById('modelSelect').innerHTML = '<option value="">Select Model...</option>';
        populateModels();
    }

    function showLoginScreen() {
        document.getElementById('chatScreen').classList.remove('active');
        document.getElementById('loginScreen').classList.add('active');
        localStorage.removeItem('currentUser');
        currentUser = null;
        currentModel = null;
        chatHistory = [];
    }

    function logout() {
        showLoginScreen();
        showToast('Logged out successfully');
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('open');
    }

    function changeModel() {
        const modelId = document.getElementById('modelSelect').value;
        currentModel = MODELS.find(m => m.id === modelId);
        
        if (currentModel) {
            document.getElementById('currentModel').textContent = currentModel.name;
            document.getElementById('modelBadge').innerHTML = 
                `<i class="fas fa-circle" style="font-size: 6px;"></i> ${currentModel.name}`;
            document.getElementById('welcomeMessage').style.display = 'none';
        }
    }

    function newChat() {
        chatHistory = [];
        document.getElementById('messages').innerHTML = `
            <div class="welcome-message" id="welcomeMessage">
                <div class="welcome-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <h2>New Chat</h2>
                <p>Select a model and start chatting</p>
                <div class="quick-actions">
                    <button class="quick-action" onclick="quickPrompt('Explain your capabilities')">
                        <i class="fas fa-star"></i> Capabilities
                    </button>
                    <button class="quick-action" onclick="quickPrompt('Write a Python code example')">
                        <i class="fas fa-code"></i> Code
                    </button>
                    <button class="quick-action" onclick="quickPrompt('Explain what API is')">
                        <i class="fas fa-question"></i> Explain
                    </button>
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;
    }

    function clearChat() {
        if (confirm('Clear chat history?')) {
            newChat();
            showToast('Chat cleared');
        }
    }

    function quickPrompt(text) {
        document.getElementById('messageInput').value = text;
        sendMessage();
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (!message) return;
        if (!currentModel) {
            showToast('Select a model first!');
            return;
        }

        const welcomeMsg = document.getElementById('welcomeMessage');
        if (welcomeMsg) welcomeMsg.style.display = 'none';

        // Добавляем сообщение пользователя
        addMessage('user', message);
        chatHistory.push({ role: 'user', content: message });

        // Очищаем инпут
        input.value = '';
        input.style.height = 'auto';
        document.getElementById('charCount').textContent = '0';

        // Показываем индикатор печати
        const typingIndicator = document.getElementById('typingIndicator');
        typingIndicator.classList.add('active');

        // Отключаем кнопку отправки
        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;

        try {
            // Отправляем запрос на серверный API
            const response = await fetch(`${API_BASE}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: currentModel.id,
                    messages: chatHistory,
                    user_id: currentUser.id,
                    system_prompt: 'You are a helpful AI assistant. Provide clear and accurate responses.'
                })
            });

            const data = await response.json();

            // Скрываем индикатор печати
            typingIndicator.classList.remove('active');

            if (data.success) {
                // Добавляем ответ ассистента
                addMessage('assistant', data.content);
                chatHistory.push({ role: 'assistant', content: data.content });
            } else {
                throw new Error(data.error || 'Unknown error');
            }

        } catch (error) {
            typingIndicator.classList.remove('active');
            addMessage('error', 'Error: ' + error.message);
        } finally {
            sendBtn.disabled = false;
        }

        scrollToBottom();
    }

    function addMessage(role, content) {
        const messagesContainer = document.getElementById('messages');
        const typingIndicator = document.getElementById('typingIndicator');

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        // Форматирование для ассистента
        if (role === 'assistant') {
            // Форматируем блоки кода
            content = content.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0;"><code>${escapeHtml(code.trim())}</code></pre>`;
            });
            // Форматируем переносы строк
            content = content.replace(/\n/g, '<br>');
        } else {
            // Экранируем HTML в сообщениях пользователя
            content = escapeHtml(content);
        }
        
        messageDiv.innerHTML = content;
        
        // Вставляем перед индикатором печати
        messagesContainer.insertBefore(messageDiv, typingIndicator);
        
        scrollToBottom();
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    function scrollToBottom() {
        const messagesContainer = document.getElementById('messages');
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 100);
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }
</script>
