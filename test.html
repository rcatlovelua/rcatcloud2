<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES-256-GCM шифрование</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border-radius: 42px;
            padding: 32px 28px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.03);
        }
        h1 {
            font-weight: 500;
            font-size: 1.9rem;
            color: #eef3ff;
            text-align: center;
            margin-bottom: 28px;
        }
        .badge-aes {
            background: #1b4a3b;
            color: #7ddfb0;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #2d7a60;
            display: inline-block;
            margin-left: 10px;
        }
        .control-panel {
            background: #111c2b;
            border-radius: 32px;
            padding: 24px 20px;
            border: 1px solid #2a3a53;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .input-group label {
            color: #a6bbdd;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-field {
            display: flex;
            align-items: center;
            background: #0a121f;
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            border: 1px solid #2b3f5e;
            transition: 0.2s;
        }
        .input-field:focus-within {
            border-color: #4ecf9e;
            box-shadow: 0 0 0 3px rgba(78, 207, 158, 0.2);
        }
        .input-field input, .input-field textarea {
            width: 100%;
            background: transparent;
            border: none;
            padding: 16px 8px 16px 0;
            color: #eaf1ff;
            font-size: 1rem;
            outline: none;
            resize: vertical;
            font-family: monospace;
        }
        .input-field textarea {
            min-height: 60px;
            padding: 12px 8px 12px 0;
        }
        .input-field button {
            background: #1b4a3b;
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            color: white;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            border: 1px solid #2d7a60;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .input-field button:hover {
            background: #2a6b55;
            border-color: #4ecf9e;
        }
        .row-2col {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row-2col > div {
            flex: 1 1 200px;
        }
        .result-box {
            background: #0b1424;
            border-radius: 28px;
            padding: 16px 20px;
            margin-top: 16px;
            border: 1px solid #1b4a3b;
        }
        .result-value {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #7ddfb0;
            word-break: break-all;
            background: #040a14;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid #1a3a2e;
            min-height: 58px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .result-value .label {
            color: #5a7a8a;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .result-value .value {
            color: #7ddfb0;
            font-weight: 400;
        }
        .result-value.empty {
            color: #3c5277;
            font-style: italic;
        }
        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .action-row button {
            flex: 1;
            background: #1f3150;
            border: none;
            border-radius: 50px;
            padding: 14px 12px;
            color: #d3e2ff;
            font-weight: 500;
            border: 1px solid #3d5780;
            cursor: pointer;
            transition: 0.15s;
        }
        .action-row button:hover {
            background: #2e4570;
            border-color: #4ecf9e;
        }
        .action-row button.primary {
            background: #1b4a3b;
            border-color: #2d7a60;
            color: white;
        }
        .action-row button.primary:hover {
            background: #2a6b55;
        }
        .badge {
            background: #1b2d49;
            border-radius: 30px;
            padding: 2px 14px;
            color: #7ddfb0;
            font-size: 0.7rem;
            border: 1px solid #1b4a3b;
        }
        .hint {
            color: #6d86b0;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #1f3150;
        }
        .security-badge {
            background: #0f2a1f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #7ddfb0;
            font-size: 0.8rem;
            display: inline-block;
            border: 1px solid #1b4a3b;
        }
        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .input-field button { padding: 10px 14px; font-size: 0.8rem; }
            .row-2col { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🔐 AES-256-GCM
        <span class="badge-aes">безопасное шифрование</span>
    </h1>

    <div class="control-panel">
        <div class="input-group">
            <label>
                <span>🔑 Пароль</span>
                <span class="security-badge">256-битный ключ</span>
            </label>
            <div class="input-field">
                <input type="password" id="passwordInput" placeholder="Введите пароль (минимум 8 символов)" value="мой_секретный_пароль_123">
                <button id="generateKeyBtn">🎲 Сгенерировать</button>
            </div>
        </div>

        <div class="row-2col">
            <div class="input-group" style="margin-bottom:0;">
                <label>📥 Исходный текст</label>
                <div class="input-field">
                    <textarea id="plainInput" rows="2" placeholder="Введите текст для шифрования">Привет, мир! Это тестовое сообщение.</textarea>
                </div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>📤 Зашифрованный текст (base64)</label>
                <div class="input-field">
                    <textarea id="cipherInput" rows="2" placeholder="Вставьте зашифрованный текст"></textarea>
                </div>
            </div>
        </div>

        <div class="action-row">
            <button id="encryptBtn" class="primary">🔒 Зашифровать</button>
            <button id="decryptBtn" class="primary">🔓 Расшифровать</button>
            <button id="clearBtn">🧹 Очистить</button>
        </div>

        <div class="result-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="color:#8aa2ca; font-size:0.8rem; text-transform:uppercase;">📋 Результат</span>
                <span class="badge" id="statusBadge">готов</span>
            </div>
            <div class="result-value" id="resultDisplay">
                <span style="color:#3c5277;">—</span>
            </div>
        </div>

        <div class="hint">
            <strong>AES-256-GCM</strong> — современный стандарт шифрования.
            Используется в банках, VPN, правительственных системах.
            <span style="display:block; margin-top:6px; color:#4a6a7a; font-size:0.7rem;">
                ⚠️ Пароль должен быть длинным и сложным. Для максимальной безопасности используйте 16+ символов.
            </span>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // -------------------- Элементы DOM --------------------
        const passwordInput = document.getElementById('passwordInput');
        const generateKeyBtn = document.getElementById('generateKeyBtn');
        const plainInput = document.getElementById('plainInput');
        const cipherInput = document.getElementById('cipherInput');
        const encryptBtn = document.getElementById('encryptBtn');
        const decryptBtn = document.getElementById('decryptBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultDisplay = document.getElementById('resultDisplay');
        const statusBadge = document.getElementById('statusBadge');

        // -------------------- Криптография (браузерная) --------------------
        async function getKeyFromPassword(password) {
            const encoder = new TextEncoder();
            const passwordData = encoder.encode(password);
            // Используем PBKDF2 для получения ключа из пароля
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                passwordData,
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: encoder.encode('aes-gcm-salt-2024'), // фиксированная соль для простоты
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                {
                    name: 'AES-GCM',
                    length: 256
                },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptAES(plainText, password) {
            if (!password || password.length < 8) {
                throw new Error('Пароль должен быть минимум 8 символов');
            }
            const key = await getKeyFromPassword(password);
            const encoder = new TextEncoder();
            const data = encoder.encode(plainText);
            
            // Генерируем случайный IV (12 байт для GCM)
            const iv = crypto.getRandomValues(new Uint8Array(12));
            
            const encrypted = await crypto.subtle.encrypt(
                {
                    name: 'AES-GCM',
                    iv: iv,
                    tagLength: 128 // 16 байт тег аутентификации
                },
                key,
                data
            );
            
            // Объединяем IV + зашифрованные данные
            const result = new Uint8Array(iv.length + encrypted.byteLength);
            result.set(iv, 0);
            result.set(new Uint8Array(encrypted), iv.length);
            
            // Возвращаем base64
            return btoa(String.fromCharCode(...result));
        }

        async function decryptAES(cipherBase64, password) {
            if (!password || password.length < 8) {
                throw new Error('Пароль должен быть минимум 8 символов');
            }
            const key = await getKeyFromPassword(password);
            
            // Декодируем base64
            const cipherData = Uint8Array.from(atob(cipherBase64), c => c.charCodeAt(0));
            
            // Извлекаем IV (первые 12 байт)
            const iv = cipherData.slice(0, 12);
            const encrypted = cipherData.slice(12);
            
            const decrypted = await crypto.subtle.decrypt(
                {
                    name: 'AES-GCM',
                    iv: iv,
                    tagLength: 128
                },
                key,
                encrypted
            );
            
            const decoder = new TextDecoder();
            return decoder.decode(decrypted);
        }

        // -------------------- Генерация пароля --------------------
        function generatePassword() {
            const length = 24;
            const charset = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=';
            let password = '';
            const array = new Uint8Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) {
                password += charset[array[i] % charset.length];
            }
            return password;
        }

        generateKeyBtn.addEventListener('click', function() {
            const newPassword = generatePassword();
            passwordInput.value = newPassword;
            setResult('🔑 Сгенерирован новый пароль', false);
            statusBadge.textContent = 'пароль обновлён';
            setTimeout(() => {
                if (resultDisplay.textContent.includes('Сгенерирован новый пароль')) {
                    setEmptyResult();
                }
            }, 2500);
        });

        // -------------------- Основные функции --------------------
        function setResult(text, isError = false) {
            resultDisplay.innerHTML = text;
            resultDisplay.classList.remove('empty');
            resultDisplay.style.color = isError ? '#f7a9a9' : '#7ddfb0';
            statusBadge.textContent = isError ? 'ошибка' : 'успешно';
            statusBadge.style.color = isError ? '#f7a9a9' : '#7ddfb0';
        }

        function setEmptyResult() {
            resultDisplay.innerHTML = '<span style="color:#3c5277;">—</span>';
            resultDisplay.classList.add('empty');
            statusBadge.textContent = 'готов';
            statusBadge.style.color = '#8aa2ca';
        }

        function formatResult(text, details = '') {
            if (text.length > 100) {
                return `<span class="label">результат</span> 
                        <span class="value">${text.substring(0, 100)}...</span>
                        <br><span style="font-size:0.7rem;color:#5a7a8a;">длина: ${text.length} символов</span>`;
            }
            return `<span class="label">результат</span> 
                    <span class="value">${text}</span>`;
        }

        async function handleEncrypt() {
            const plain = plainInput.value;
            const password = passwordInput.value;
            
            if (!plain) {
                setResult('❌ Введите текст для шифрования', true);
                return;
            }
            if (!password || password.length < 8) {
                setResult('❌ Пароль должен быть минимум 8 символов', true);
                return;
            }
            
            try {
                const encrypted = await encryptAES(plain, password);
                cipherInput.value = encrypted;
                setResult(formatResult(encrypted, 'Зашифровано'));
                statusBadge.textContent = '✅ зашифровано';
            } catch (e) {
                setResult('❌ Ошибка: ' + e.message, true);
                statusBadge.textContent = 'ошибка';
                statusBadge.style.color = '#f7a9a9';
            }
        }

        async function handleDecrypt() {
            const cipher = cipherInput.value;
            const password = passwordInput.value;
            
            if (!cipher) {
                setResult('❌ Введите зашифрованный текст', true);
                return;
            }
            if (!password || password.length < 8) {
                setResult('❌ Пароль должен быть минимум 8 символов', true);
                return;
            }
            
            try {
                const decrypted = await decryptAES(cipher, password);
                plainInput.value = decrypted;
                setResult(formatResult(decrypted, 'Расшифровано'));
                statusBadge.textContent = '✅ расшифровано';
            } catch (e) {
                setResult('❌ Ошибка: ' + e.message, true);
                statusBadge.textContent = 'ошибка';
                statusBadge.style.color = '#f7a9a9';
            }
        }

        function clearAll() {
            plainInput.value = '';
            cipherInput.value = '';
            setEmptyResult();
            statusBadge.textContent = 'очищено';
            statusBadge.style.color = '#8aa2ca';
            setTimeout(() => {
                statusBadge.textContent = 'готов';
                statusBadge.style.color = '#8aa2ca';
            }, 800);
        }

        // -------------------- Обработчики --------------------
        encryptBtn.addEventListener('click', handleEncrypt);
        decryptBtn.addEventListener('click', handleDecrypt);
        clearBtn.addEventListener('click', clearAll);

        plainInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) handleEncrypt();
        });
        cipherInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) handleDecrypt();
        });

        // -------------------- Инициализация --------------------
        setEmptyResult();
        
        // Демо-пример
        setTimeout(async () => {
            try {
                const demoText = 'Привет! Это демонстрация AES-256-GCM шифрования.';
                const demoPass = passwordInput.value || 'мой_секретный_пароль_123';
                const encrypted = await encryptAES(demoText, demoPass);
                plainInput.value = demoText;
                cipherInput.value = encrypted;
                setResult('🔐 Демонстрация готова! Нажмите "Расшифровать"', false);
                statusBadge.textContent = 'демо';
                setTimeout(() => {
                    if (resultDisplay.textContent.includes('Демонстрация')) {
                        setEmptyResult();
                        statusBadge.textContent = 'готов';
                    }
                }, 3000);
            } catch (e) {
                // игнорируем
            }
        }, 500);
    })();
</script>
</body>
</html>
