<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест шифрования: true ↔ ключ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 42px;
            padding: 32px 28px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.03);
        }
        h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
            color: #eef3ff;
            text-align: center;
            margin-bottom: 28px;
            text-shadow: 0 2px 3px rgba(0,0,0,0.6);
        }
        h1 span {
            background: #2d3b57;
            padding: 0 14px;
            border-radius: 60px;
            color: #b7cdff;
            font-weight: 400;
            font-size: 1.2rem;
            margin-left: 10px;
            border: 1px solid #4a5c80;
        }
        .control-panel {
            background: #111c2b;
            border-radius: 32px;
            padding: 24px 20px 20px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 6px 12px rgba(0,0,0,0.3);
            border: 1px solid #2a3a53;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 24px;
        }
        .input-group label {
            color: #a6bbdd;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group label i {
            opacity: 0.7;
            font-style: normal;
            background: #1f3147;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #90adf0;
        }
        .input-field {
            display: flex;
            align-items: center;
            background: #0a121f;
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            border: 1px solid #2b3f5e;
            transition: 0.2s;
        }
        .input-field:focus-within {
            border-color: #6f96f0;
            box-shadow: 0 0 0 3px rgba(79, 130, 255, 0.2);
        }
        .input-field input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 16px 8px 16px 0;
            color: #eaf1ff;
            font-size: 1rem;
            outline: none;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .input-field input::placeholder {
            color: #495e7e;
            font-weight: 300;
        }
        .input-field button {
            background: #2b3f62;
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            color: white;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            border: 1px solid #405a82;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .input-field button:hover {
            background: #3b5280;
            transform: scale(1.01);
            border-color: #6b8ed9;
        }
        .input-field button:active {
            transform: scale(0.95);
            background: #1e3150;
        }
        .row-2col {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row-2col > div {
            flex: 1 1 160px;
        }
        .result-box {
            background: #0b1424;
            border-radius: 28px;
            padding: 16px 20px;
            margin-top: 20px;
            border: 1px solid #263a57;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }
        .result-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8aa2ca;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .result-value {
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 1.3rem;
            font-weight: 500;
            color: #d6e5ff;
            word-break: break-all;
            background: #040a14;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid #1e3150;
            min-height: 58px;
            display: flex;
            align-items: center;
        }
        .result-value.empty {
            color: #3c5277;
            font-style: italic;
            font-weight: 300;
        }
        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            flex-wrap: wrap;
        }
        .action-row button {
            flex: 1;
            background: #1f3150;
            border: none;
            border-radius: 50px;
            padding: 14px 12px;
            color: #d3e2ff;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid #3d5780;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-row button:hover {
            background: #2e4570;
            border-color: #5d7fc0;
            color: white;
        }
        .action-row button:active {
            transform: scale(0.96);
            background: #14243e;
        }
        .action-row button.primary {
            background: #3d5e95;
            border-color: #6b8fe0;
            color: white;
            flex: 1.3;
        }
        .action-row button.primary:hover {
            background: #4f74b3;
        }
        .hint {
            color: #6d86b0;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 18px;
            border-top: 1px solid #1f3150;
            padding-top: 18px;
            letter-spacing: 0.2px;
        }
        .hint strong {
            color: #a8c0f0;
            font-weight: 500;
        }
        .badge {
            background: #1b2d49;
            border-radius: 30px;
            padding: 2px 14px;
            color: #9bb6ed;
            font-size: 0.7rem;
            border: 1px solid #37517a;
        }
        .flex-icon {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .input-field button { padding: 10px 14px; font-size: 0.8rem; }
            .row-2col { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🔐 тест шифра
        <span>true</span>
    </h1>

    <div class="control-panel">
        <!-- Ввод ключа -->
        <div class="input-group">
            <label>
                <span>🔑 Ключевое слово</span>
                <i>(пароль шифрования)</i>
            </label>
            <div class="input-field">
                <input type="text" id="keyInput" placeholder="например: секрет" value="ключ">
                <button id="setKeyBtn">Установить</button>
            </div>
        </div>

        <!-- Две колонки: ввод true / false -->
        <div class="row-2col">
            <div class="input-group" style="margin-bottom: 0;">
                <label>📥 <span style="color:#b7d0ff;">Исходное значение</span></label>
                <div class="input-field">
                    <input type="text" id="plainInput" placeholder="true или false" value="true">
                    <button id="encryptBtn">Шифровать</button>
                </div>
            </div>
            <div class="input-group" style="margin-bottom: 0;">
                <label>📤 <span style="color:#b7d0ff;">Зашифрованный текст</span></label>
                <div class="input-field">
                    <input type="text" id="cipherInput" placeholder="вставьте шифр">
                    <button id="decryptBtn">Расшифровать</button>
                </div>
            </div>
        </div>

        <!-- Результат -->
        <div class="result-box">
            <div class="result-label">
                <span>📋 Результат</span>
                <span class="badge" id="statusBadge">готов</span>
            </div>
            <div class="result-value" id="resultDisplay">—</div>
        </div>

        <!-- Действия -->
        <div class="action-row">
            <button id="encryptTrueBtn" class="primary">🔒 Зашифровать "true"</button>
            <button id="decryptToTrueBtn">🔓 Расшифровать → true</button>
            <button id="clearAllBtn">🧹 Очистить</button>
        </div>

        <div class="hint">
            <strong>Как работает:</strong> значение <strong>«true»</strong> (или любое другое) шифруется с помощью ключевого слова.
            Расшифровка возможна только с тем же ключом.
        </div>
    </div>
</div>

<script>
         // Преобразуем строку в массив байтов UTF-8
function stringToBytes(str) {
    const encoder = new TextEncoder();
    return encoder.encode(str);
}

// Преобразуем байты обратно в строку
function bytesToString(bytes) {
    const decoder = new TextDecoder();
    return decoder.decode(bytes);
}

// Шифрование (работает с байтами)
function encryptXor(plainText, key) {
    const plainBytes = stringToBytes(plainText);
    const keyBytes = stringToBytes(key);
    const result = new Uint8Array(plainBytes.length);

    for (let i = 0; i < plainBytes.length; i++) {
        result[i] = plainBytes[i] ^ keyBytes[i % keyBytes.length];
    }

    // Превращаем байты в hex-строку
    return Array.from(result)
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}

// Расшифровка
function decryptXor(hexString, key) {
    const bytes = new Uint8Array(
        hexString.match(/.{1,2}/g).map(hex => parseInt(hex, 16))
    );
    const keyBytes = stringToBytes(key);
    const result = new Uint8Array(bytes.length);

    for (let i = 0; i < bytes.length; i++) {
        result[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
    }

    return bytesToString(result);
}
</script>
</body>
          </html>
