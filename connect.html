<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Привязка RCS</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: white; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 16px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        input { padding: 10px; border-radius: 8px; border: none; margin-bottom: 10px; width: 80%; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #5865F2; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Привязка Дискорда</h2>
        <p>Введите код из Роблокса:</p>
        <input type="text" id="code" placeholder="Например: 123456">
        <br>
        <button onclick="startAuth()">Войти через Discord</button>
    </div>

    <script>
        function startAuth() {
            const code = document.getElementById('code').value;
            if (!code) return alert('Введите код!');
            
            const clientId = "ТВОЙ_CLIENT_ID_СЮДА"; // Можно вписать вручную
            const redirectUri = encodeURIComponent("https://rcatcloud2.vercel.app/api/discord-callback");
            
            // Отправляем пользователя в Дискорд, передавая наш код как state
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify&state=${code}`;
        }
    </script>
</body>
</html>
