<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL - SECURE ACCESS</title>
    <style>
        :root {
            --green: #00ff41;
            --bg: #050505;
            --glow: 0 0 8px rgba(0, 255, 65, 0.4);
            --danger: #ff003c;
        }

        body {
            background-color: var(--bg);
            color: var(--green);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            font-size: 14px;
        }

        .header {
            border-bottom: 2px solid var(--green);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: var(--glow);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #888;
        }

        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            border: 1px solid var(--green);
            padding: 15px;
            background: rgba(0, 255, 65, 0.02);
            position: relative;
            transition: 0.3s;
        }

        .card:hover {
            box-shadow: var(--glow);
            background: rgba(0, 255, 65, 0.05);
        }

        .card-id {
            color: #888;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            padding: 8px 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: var(--green);
            color: #000;
        }

        button.delete {
            border-color: var(--danger);
            color: var(--danger);
        }

        button.delete:hover {
            background: var(--danger);
            color: #fff;
        }

        #loader {
            color: yellow;
            margin-bottom: 20px;
        }

        .log-panel {
            margin-top: 30px;
            border-top: 1px dashed #333;
            padding-top: 10px;
            color: #555;
            height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="header">
    <div>[ SYSTEM ADMINISTRATION INTERFACE ]</div>
    <div>NODE: orrcs.api.proxy | ACCESS_LEVEL: SECURE_TOKEN_REQUIRED</div>
</div>

<div class="stats" id="stats">
    <span>UPTIME: 99.9%</span>
    <span>STATUS: <span style="color: yellow">CONNECTING...</span></span>
</div>

<div id="loader">> INITIALIZING_CONNECTION...</div>

<div class="post-grid" id="postGrid">
    </div>

<div class="log-panel" id="logPanel">
    > SYSTEM STANDBY...<br>
</div>

<script>
    // 1. Тестовые данные (потом мы заменим это на реальный fetch запрос к твоему API)
    let mockDatabase = [
        { id: 'uuid-101', title: 'Взлом Пентагона (Учебный)', content: 'Процесс завершен на 42%...' },
        { id: 'uuid-102', title: 'Дамп логов сервера', content: 'Обнаружена подозрительная активность в секторе 7.' },
        { id: 'uuid-103', title: 'Резервная копия', content: 'Бэкап базы данных успешно создан.' }
    ];

    const loader = document.getElementById('loader');
    const grid = document.getElementById('postGrid');
    const logPanel = document.getElementById('logPanel');
    const statsStatus = document.querySelector('#stats span:nth-child(2)');

    // Функция для добавления логов в консоль внизу
    function addLog(message) {
        const time = new Date().toLocaleTimeString();
        logPanel.innerHTML += `[${time}] ${message}<br>`;
        logPanel.scrollTop = logPanel.scrollHeight;
    }

    // 2. Функция отрисовки данных
    function renderPosts() {
        grid.innerHTML = '';
        mockDatabase.forEach(post => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-id">ID: ${post.id}</div>
                <h3 style="margin: 0 0 10px 0;">> ${post.title}</h3>
                <p style="margin: 0; color: #ccc;">${post.content}</p>
                <div class="btn-group">
                    <button onclick="editPost('${post.id}')">EDIT</button>
                    <button class="delete" onclick="deletePost('${post.id}')">DELETE</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 3. Заглушки для будущих API-запросов (с ключом ADMINPLUS_KEY)
    function deletePost(id) {
        addLog(`WARN: Инициировано удаление записи [${id}]...`);
        
        // Позже здесь будет: fetch('/api/admin/delete', { headers: { 'Authorization': 'твой_ключ' } })
        setTimeout(() => {
            mockDatabase = mockDatabase.filter(p => p.id !== id);
            renderPosts();
            addLog(`SUCCESS: Запись [${id}] уничтожена.`);
        }, 500);
    }

    function editPost(id) {
        addLog(`INFO: Запрос доступа к редактированию [${id}]...`);
        alert(`Здесь откроется модальное окно для радактирования поста: ${id}`);
    }

    // 4. Имитация загрузки и подключения к нашему безопасному серверу
    setTimeout(() => {
        loader.innerText = '> FETCHING_DATA_FROM_SECURE_API...';
        addLog('Установка защищенного соединения...');
        
        setTimeout(() => {
            loader.style.display = 'none';
            statsStatus.innerHTML = 'STATUS: <span style="color: var(--green)">ONLINE / SECURE</span>';
            addLog('Соединение установлено. Данные получены.');
            renderPosts();
        }, 800);
        
    }, 1000);

</script>
</body>
</html>
