    <style>
        :root {
            --green: #00ff41;
            --bg: #050505;
            --glow: 0 0 8px rgba(0, 255, 65, 0.4);
            --danger: #ff003c;
        }

        body {
            background-color: var(--bg);
            color: var(--green);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            font-size: 14px;
        }

        .header {
            border-bottom: 2px solid var(--green);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: var(--glow);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #888;
        }

        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            border: 1px solid var(--green);
            padding: 15px;
            background: rgba(0, 255, 65, 0.02);
            position: relative;
        }

        .card:hover {
            box-shadow: var(--glow);
            background: rgba(0, 255, 65, 0.05);
        }

        input, textarea {
            background: #000;
            border: 1px solid #333;
            color: var(--green);
            width: 100%;
            margin: 5px 0 10px 0;
            padding: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus { border-color: var(--green); outline: none; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            padding: 8px 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: var(--green);
            color: #000;
        }

        button.delete {
            border-color: var(--danger);
            color: var(--danger);
        }

        button.delete:hover {
            background: var(--danger);
            color: #fff;
        }

        .img-wrap {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }

        .img-preview {
            max-width: 100%;
            max-height: 150px;
            border: 1px solid #333;
        }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--green);
            color: #000;
            padding: 2px 10px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
