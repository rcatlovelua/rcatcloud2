<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL - MESSENGER MODERATION</title>
    <style>
        :root {
            --green: #00ff41;
            --bg: #050505;
            --glow: 0 0 10px rgba(0, 255, 65, 0.5);
            --danger: #ff003c;
            --warning: #ffb100;
        }

        body {
            background-color: var(--bg);
            color: var(--green);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            font-size: 14px;
            line-height: 1.4;
        }

        .hidden { display: none !important; }

        /* HEADER */
        .header {
            border-bottom: 2px solid var(--green);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: var(--glow);
        }

        /* LOGIN SCREEN */
        #login-screen {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .login-frame {
            border: 1px solid var(--green);
            padding: 30px;
            background: rgba(0, 255, 65, 0.05);
            box-shadow: var(--glow);
        }

        /* GRID */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 20px;
        }

        .card {
            border: 1px solid var(--green);
            padding: 15px;
            background: rgba(0, 255, 65, 0.02);
            position: relative;
        }
        .card:hover { box-shadow: var(--glow); }

        .card-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed var(--green);
            margin-bottom: 10px;
            padding-bottom: 5px;
            font-size: 0.85em;
            color: #888;
        }

        .card-title { font-weight: bold; font-size: 1.1em; display: block; margin-bottom: 5px; color: #fff; }
        .card-content { margin-bottom: 15px; white-space: pre-wrap; }

        .img-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid #333;
            margin: 10px 0;
        }

        .no-img {
            border: 1px dashed #333;
            padding: 10px;
            text-align: center;
            color: #444;
            margin: 10px 0;
        }

        /* BUTTONS */
        button, input {
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
        }
        button:hover { background: var(--green); color: #000; }
        input { width: 250px; margin-bottom: 10px; outline: none; }
        
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-warn { border-color: var(--warning); color: var(--warning); }
        .btn-warn:hover { background: var(--warning); color: #000; }

        /* MODAL */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-box {
            border: 2px solid var(--green);
            background: #000;
            padding: 25px;
            width: 500px;
            box-shadow: var(--glow);
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            color: var(--green);
            border: 1px solid var(--green);
            font-family: inherit;
            padding: 10px;
            box-sizing: border-box;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="header">
    <div>[ SYSTEM MODERATION TERMINAL v2.0 ]</div>
    <div>USER: <span id="user-display">UNAUTHORIZED</span> | STATUS: <span id="status-display">STANDBY</span></div>
</div>

<div id="login-screen">
    <div class="login-frame">
        <div>ENTER ADMIN KEY:</div>
        <input type="password" id="pass-input" autofocus>
        <br>
        <button onclick="login()">AUTHORIZE</button>
    </div>
</div>

<div id="main-screen" class="hidden">
    <div style="margin-bottom: 20px;">
        <button onclick="fetchPosts()">> REFRESH_DATABASE</button>
        <button onclick="logout()" class="btn-danger">LOGOUT</button>
    </div>
    <div class="post-grid" id="post-grid"></div>
</div>

<div id="modal-overlay" class="hidden">
    <div class="modal-box">
        <h3>> EDIT_RECORD</h3>
        <div>TITLE:</div>
        <input type="text" id="edit-title" style="width: 100%;">
        <div>CONTENT:</div>
        <textarea id="edit-content"></textarea>
        <div style="display: flex; gap: 10px;">
            <button onclick="saveEdit()">[ SAVE_CHANGES ]</button>
            <button onclick="closeModal()" class="btn-danger">[ CANCEL ]</button>
        </div>
    </div>
</div>

<script>
    let currentPosts = [];
    let currentEditId = null;

    // --- АВТОРИЗАЦИЯ ---
    async function login() {
        const password = document.getElementById('pass-input').value;
        try {
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('admin_session', data.token);
                showDashboard();
            } else { alert("ACCESS DENIED"); }
        } catch (e) {
            // Тестовый вход для разработки
            if(password === "123") { showDashboard(); } 
            else { alert("API ERROR"); }
        }
    }

    function showDashboard() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('user-display').innerText = "ADMIN_PLUS";
        document.getElementById('status-display').innerText = "ONLINE";
        fetchPosts();
    }

    function logout() {
        localStorage.removeItem('admin_session');
        location.reload();
    }

    // --- РАБОТА С ДАННЫМИ ---
    async function fetchPosts() {
        const grid = document.getElementById('post-grid');
        grid.innerHTML = "> FETCHING_RECORDS...";
        
        try {
            const res = await fetch('/api/posts');
            currentPosts = await res.json();
            renderPosts();
        } catch (e) {
            grid.innerHTML = "FAILED TO FETCH POSTS FROM API";
        }
    }

    function renderPosts() {
        const grid = document.getElementById('post-grid');
        grid.innerHTML = '';

        currentPosts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const imageBlock = post.imageurl 
                ? `<img src="${post.imageurl}" class="img-preview">
                   <button class="btn-warn" onclick="deletePhoto(${post.id})" style="width:100%; margin-bottom:10px;">[ DELETE_PHOTO ]</button>`
                : `<div class="no-img">NO_IMAGE_ATTACHED</div>`;

            card.innerHTML = `
                <div class="card-header">
                    <span>ID: ${post.id}</span>
                    <span>@${post.author}</span>
                </div>
                <span class="card-title">> ${post.title}</span>
                <div class="card-content">${post.content}</div>
                ${imageBlock}
                <div style="display: flex; gap: 5px; margin-top: 10px;">
                    <button onclick="openEdit(${post.id})">[ EDIT ]</button>
                    <button class="btn-danger" onclick="deletePost(${post.id})">[ DELETE ]</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // --- ФУНКЦИИ МОДЕРАЦИИ ---

    // 1. Удаление фото
    async function deletePhoto(id) {
        if (!confirm("CONFIRM PHOTO DELETION?")) return;
        console.log(`Sending request: Setting imageurl = null for post ${id}`);
        
        // Тут твой запрос к бэкенду (PATCH или POST)
        // Обновляем локально для вида:
        const post = currentPosts.find(p => p.id === id);
        if (post) post.imageurl = null;
        renderPosts();
    }

    // 2. Редактирование
    function openEdit(id) {
        currentEditId = id;
        const post = currentPosts.find(p => p.id === id);
        document.getElementById('edit-title').value = post.title;
        document.getElementById('edit-content').value = post.content;
        document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.add('hidden');
    }

    async function saveEdit() {
        const newTitle = document.getElementById('edit-title').value;
        const newContent = document.getElementById('edit-content').value;

        // Здесь запрос к API: fetch('/api/posts/update', { method: 'POST', body: ... })
        console.log(`Saving Post ${currentEditId}:`, { newTitle, newContent });

        // Обновляем локально:
        const post = currentPosts.find(p => p.id === currentEditId);
        if (post) {
            post.title = newTitle;
            post.content = newContent;
        }
        
        closeModal();
        renderPosts();
    }

    // 3. Удаление поста
    async function deletePost(id) {
        if (!confirm("WIPE RECORD FROM DATABASE?")) return;
        currentPosts = currentPosts.filter(p => p.id !== id);
        renderPosts();
    }

    window.onload = () => {
        if (localStorage.getItem('admin_session')) showDashboard();
    };
</script>

</body>
</html>
