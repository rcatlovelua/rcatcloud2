<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Devs - ein Ort, der WIRKLICH ein Ort ist.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f2fa 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 32px 20px;
            color: #1a1a2e;
            min-height: 100vh;
        }

        .material-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header */
        .app-bar {
            margin-bottom: 32px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .app-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1a1a2e, #4a4a6a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .app-title:hover {
            opacity: 0.8;
        }
        
        .app-title span {
            background: none;
            color: #6366f1;
            font-size: 2rem;
        }
        
        .badge {
            background: linear-gradient(135deg, #e8eaff, #dddff5);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #4f46e5;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .badge:hover {
            transform: scale(0.98);
            background: linear-gradient(135deg, #dddff5, #cfd1ea);
        }

        /* Info note */
        .info-note {
            background: linear-gradient(135deg, #eef2ff, #e6e9ff);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.75rem;
            color: #4f46e5;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        .beta-note {
            background: rgba(0, 0, 0, 0.03);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            font-weight: 500;
        }
        /* Create post card */
        .create-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
            padding: 24px 28px;
            border: 1px solid rgba(99, 102, 241, 0.1);
            transition: box-shadow 0.2s;
        }
        
        .create-card:focus-within {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        .input-field {
            margin-bottom: 20px;
        }
        
        .input-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #6b7280;
            margin-bottom: 6px;
            margin-left: 12px;
            text-transform: uppercase;
        }
        
        .material-input, .material-textarea {
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 20px;
            padding: 12px 18px;
            font-family: 'Inter', monospace;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #1f2937;
            outline: none;
            resize: vertical;
        }
        
        .material-input:focus, .material-textarea:focus {
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .material-textarea {
            min-height: 100px;
        }
        
        .btn-filled {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-weight: 600;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }
        
        .btn-filled:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        
        .btn-filled:active {
            transform: translateY(0);
        }
        
        .btn-filled:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-wrapper {
            display: flex;
            justify-content: flex-end;
        }

        /* Feed */
        .feed-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 20px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1f2937;
        }
        
        .feed-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .post-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
            padding: 24px 28px;
            border-left: 4px solid #6366f1;
            animation: fadeInUp 0.3s ease-out;
        }
        
        .post-card:hover {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .post-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .post-title-icon {
            color: #6366f1;
            font-size: 1.6rem;
        }
        
        .post-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #4b5563;
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 12px;
        }
        
        .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
            font-size: 0.8rem;
        }
        
        .post-author {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6366f1;
            font-weight: 500;
        }
        
        .post-author .material-symbols-outlined {
            font-size: 1rem;
        }
        
        .post-time {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #9ca3af;
        }
        
        .post-actions {
            margin-top: 16px;
        }
        
        .action-btn {
            background: none;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #6366f1;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .action-btn:hover {
            background: #eef2ff;
        }
        
        .action-btn .material-symbols-outlined {
            font-size: 1.1rem;
        }
        
        .replies-section {
            margin-top: 20px;
            padding-left: 20px;
            border-left: 3px solid #eef2ff;
        }
        
        .reply-card {
            background: #fafbff;
            border-radius: 24px;
            padding: 14px 18px;
            margin-top: 12px;
            transition: background 0.2s;
        }
        
        .reply-card:hover {
            background: #f5f7ff;
        }
        
        .reply-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .reply-author {
            font-weight: 600;
            color: #6366f1;
            font-size: 0.85rem;
        }
        
        .reply-time {
            font-size: 0.65rem;
            color: #9ca3af;
        }
        
        .reply-content {
            color: #4b5563;
            margin-top: 6px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        
        .reply-form {
            margin-top: 12px;
            display: none;
            gap: 12px;
            flex-direction: column;
        }
        
        .reply-form.active {
            display: flex;
        }
        
        .reply-input {
            width: 100%;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            outline: none;
        }
        
        .reply-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }
        
        .small-btn {
            padding: 8px 20px;
            font-size: 0.75rem;
            align-self: flex-end;
            background: #6366f1;
        }
        
        .empty-state {
            background: white;
            border-radius: 32px;
            padding: 60px 32px;
            text-align: center;
            color: #9ca3af;
            border: 1px dashed #e5e7eb;
        }
        
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            color: #6366f1;
            gap: 12px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .toast-message {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 28px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            backdrop-filter: blur(8px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        
        @media (max-width: 640px) {
            body { padding: 20px 16px; }
            .post-title { font-size: 1.2rem; }
            .create-card { padding: 20px; }
            .toast-message { white-space: normal; max-width: 90%; text-align: center; }
        }
    </style>
</head>
<body>

<div class="material-container">
    <div class="app-bar">
        <div class="app-title" id="refreshFeed">
            <span class="material-symbols-outlined">developer_mode</span>
            Devs
        </div>
        <div class="badge" id="refreshBadge">
            <span class="material-symbols-outlined" style="font-size: 14px;">rss_feed</span> 
            Das Band neu laden...
        </div>
    </div>

    <div class="info-note">
        <span class="material-symbols-outlined" style="font-size: 14px;">info</span>
        Datenbank: 30 MB Speicher • Bilder werden nicht unterstützt
    </div>
    <div class="beta-note">
        <span class="material-symbols-outlined" style="font-size: 14px;">info</span>
        Devs in der Alpha-Version! alles kann sich ändern.
    </div>
    <div class="create-card">
        <div class="input-field">
            <label>Ihr Name *</label>
            <input type="text" id="authorName" class="material-input" placeholder="Как вас зовут?" autocomplete="off" maxlength="50">
        </div>
        <div class="input-field">
            <label>Überschrift</label>
            <input type="text" id="title" class="material-input" placeholder="О чем расскажете?" autocomplete="off">
        </div>
        <div class="input-field">
            <label>INHALT</label>
            <textarea id="content" class="material-textarea" rows="3" placeholder="Что нового? Идеи, код, мысли..."></textarea>
        </div>
        <div class="input-field">
            <label>PRIVATER SCHLÜSSEL *</label>
            <input type="password" id="adminPassword" class="material-input" placeholder="Пароль для публикации">
        </div>
        <div class="button-wrapper">
            <button class="btn-filled" id="publishBtn">
                <span class="material-symbols-outlined" style="font-size: 18px;">send</span> 
                Post veröffentlichen
            </button>
        </div>
    </div>

    <div class="feed-title">
        <span class="material-symbols-outlined" style="font-size: 22px;">dynamic_feed</span> 
        Letzte Diskussionen
    </div>
    <div id="feed" class="feed-grid">
        <div class="loading-spinner">
            <span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">progress_activity</span> 
            <span>Beiträge laden...</span>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-message"></div>

<script>
    const API_POSTS = '/api/posts';
    const API_REPLIES = '/api/replies';
    let allPosts = [];

    function showToast(message, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = message;
        toast.style.opacity = '1';
        toast.style.background = isError ? '#dc2626' : '#1f2937';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatTime(timestamp) {
        if (!timestamp) return 'только что';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);
        
        if (diff < 60) return 'только что';
        if (diff < 3600) return `${Math.floor(diff / 60)} мин назад`;
        if (diff < 86400) return `${Math.floor(diff / 3600)} ч назад`;
        if (diff < 604800) return `${Math.floor(diff / 86400)} дн назад`;
        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    function getAvatarColor(name) {
        if (!name) return '#6366f1';
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = ((hash << 5) - hash) + name.charCodeAt(i);
            hash |= 0;
        }
        const colors = ['#6366f1', '#8b5cf6', '#ec489a', '#f97316', '#10b981', '#06b6d4', '#ef4444'];
        return colors[Math.abs(hash) % colors.length];
    }

    function toggleReplyForm(postId) {
        const form = document.getElementById(`reply-form-${postId}`);
        if (form) {
            form.classList.toggle('active');
            if (form.classList.contains('active')) {
                const input = form.querySelector('.reply-input');
                if (input) input.focus();
            }
        }
    }

    async function sendReply(postId, postTitle) {
        const form = document.getElementById(`reply-form-${postId}`);
        const input = form?.querySelector('.reply-input');
        const replyContent = input?.value.trim();
        const authorInput = document.getElementById('authorName');
        const author = authorInput.value.trim();
        
        const passwordInput = document.getElementById('adminPassword');
        const password = passwordInput.value.trim();

        if (!replyContent) {
            showToast('Schreibe den Antworttext', true);
            return;
        }

        if (!author) {
            showToast('Geben Sie Ihren Namen ein, bevor Sie antworten', true);
            authorInput.focus();
            return;
        }

        if (!password) {
            showToast('Geben Sie den privaten Schlüssel ein', true);
            return;
        }

        const replyData = {
            postId: postId,
            content: replyContent,
            author: author,
            password: password
        };

        const btn = form?.querySelector('.small-btn');
        const originalText = btn?.innerHTML;
        if (btn) {
            btn.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">progress_activity</span> Sendung...';
            btn.disabled = true;
        }

        try {
            const response = await fetch(API_REPLIES, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(replyData)
            });

            if (!response.ok) {
                if (response.status === 403) {
                    const error = await response.json();
                    throw new Error(error.error || 'Falsches Passwort');
                }
                throw new Error('Fehler beim Senden der Antwort');
            }

            if (input) input.value = '';
            form?.classList.remove('active');
            showToast('Die Antwort ist veröffentlicht!', false);
            await loadPosts();
        } catch (error) {
            showToast(error.message, true);
        } finally {
            if (btn) {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    }

    function renderPosts(posts) {
        const feedContainer = document.getElementById('feed');
        feedContainer.innerHTML = '';

        if (posts.length === 0) {
            feedContainer.innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-outlined" style="font-size: 56px; margin-bottom: 16px; display: block;">forum</span>
                    <p style="margin-bottom: 8px;">Noch keine Beiträge</p>
                    <p style="font-size: 0.85rem;">Sei der erste, der eine Idee teilt!</p>
                </div>
            `;
            return;
        }

        const sortedPosts = [...posts].sort((a, b) => (b.timestamp || b.id || 0) - (a.timestamp || a.id || 0));

        for (const post of sortedPosts) {
            const title = post.title?.trim() || 'Без заголовка';
            const content = post.content?.trim() || '—';
            const author = post.author?.trim() || 'Аноним';
            const authorColor = getAvatarColor(author);
            const timestamp = post.timestamp || post.id;
            const timeStr = formatTime(timestamp);
            const replies = post.replies || [];
            const postId = post.id || timestamp;

            const postCard = document.createElement('div');
            postCard.className = 'post-card';
            
            let repliesHtml = '';
            if (replies.length > 0) {
                const sortedReplies = [...replies].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                repliesHtml = `<div class="replies-section">`;
                for (const reply of sortedReplies) {
                    const replyAuthor = reply.author || 'Аноним';
                    const replyTime = formatTime(reply.timestamp);
                    repliesHtml += `
                        <div class="reply-card">
                            <div class="reply-header">
                                <span class="reply-author">${escapeHtml(replyAuthor)}</span>
                                <span class="reply-time">• ${replyTime}</span>
                            </div>
                            <div class="reply-content">${escapeHtml(reply.content).replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                }
                repliesHtml += `</div>`;
            }

            postCard.innerHTML = `
                <div class="post-title">
                    <span class="material-symbols-outlined post-title-icon">article</span>
                    ${escapeHtml(title)}
                </div>
                <div class="post-content">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                <div class="post-meta">
                    <div class="post-author">
                        <span class="material-symbols-outlined">account_circle</span>
                        <span style="color: ${authorColor};">${escapeHtml(author)}</span>
                    </div>
                    <div class="post-time">
                        <span class="material-symbols-outlined" style="font-size: 14px;">schedule</span>
                        ${timeStr}
                    </div>
                </div>
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleReplyForm(${postId})">
                        <span class="material-symbols-outlined">reply</span>
                        Antworten (${replies.length})
                    </button>
                </div>
                <div id="reply-form-${postId}" class="reply-form">
                    <textarea class="reply-input" rows="2" placeholder="Schreibe eine Antwort..."></textarea>
                    <button class="btn-filled small-btn" onclick="sendReply(${postId}, '${escapeHtml(title).replace(/'/g, "\\'")}')">
                        Antwort senden
                    </button>
                </div>
                ${repliesHtml}
            `;
            feedContainer.appendChild(postCard);
        }
    }

    async function loadPosts() {
        const feedContainer = document.getElementById('feed');
        feedContainer.innerHTML = `
            <div class="loading-spinner">
                <span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">sync</span>
                <span>Aktualisieren des Feeds...</span>
            </div>
        `;
        
        try {
            const response = await fetch(API_POSTS);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const posts = await response.json();
            
            allPosts = Array.isArray(posts) ? posts : [];
            renderPosts(allPosts);
        } catch (error) {
            console.error('Fehler beim Laden:', error);
            feedContainer.innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-outlined" style="font-size: 48px;">error</span>
                    <p style="margin-top: 16px;">Das Band konnte nicht geladen werden</p>
                    <button id="retryLoadBtn" style="margin-top: 20px; background: #6366f1; border: none; border-radius: 40px; padding: 10px 28px; color: white; font-weight: 500; cursor: pointer;">Wiederholen</button>
                </div>
            `;
            const retryBtn = document.getElementById('retryLoadBtn');
            if (retryBtn) retryBtn.addEventListener('click', () => loadPosts());
            showToast('Ошибка загрузки ленты', true);
        }
    }

    async function sendPost() {
        const authorInput = document.getElementById('authorName');
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const passwordInput = document.getElementById('adminPassword');
        
        const author = authorInput.value.trim();
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!title && !content) {
            showToast('Füllen Sie den Titel oder den Inhalt des Beitrags aus', true);
            return;
        }

        if (!author) {
            showToast('Geben Sie Ihren Namen ein', true);
            authorInput.focus();
            return;
        }

        if (!password) {
            showToast('Geben Sie den privaten Schlüssel ein', true);
            passwordInput.focus();
            return;
        }
        
        const postData = {
            title: title || "(Ohne Titel)",
            content: content || "—",
            password: password,
            author: author,
            timestamp: Date.now()
        };
        
        const publishButton = document.getElementById('publishBtn');
        const originalButtonText = publishButton.innerHTML;
        
        publishButton.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px; animation: spin 0.8s linear infinite;">progress_activity</span> Sendung...`;
        publishButton.disabled = true;
        
        try {
            const response = await fetch(API_POSTS, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData)
            });
            
            if (!response.ok) {
                if (response.status === 403) {
                    const error = await response.json();
                    throw new Error(error.error || "Falsches Passwort");
                }
                throw new Error(`Fehler ${response.status}`);
            }
            
            authorInput.value = '';
            titleInput.value = '';
            contentInput.value = '';
            passwordInput.value = '';
            
            showToast('Beitrag veröffentlicht! 🚀`, false);
            await loadPosts();
        } catch (error) {
            console.error('Fehler beim Senden:', error);
            showToast(error.message, true);
        } finally {
            publishButton.innerHTML = originalButtonText;
            publishButton.disabled = false;
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        const publishBtn = document.getElementById('publishBtn');
        if (publishBtn) publishBtn.addEventListener('click', sendPost);
        
        const textarea = document.getElementById('content');
        if (textarea) {
            textarea.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    sendPost();
                }
            });
        }
        
        const refreshBtn = document.getElementById('refreshFeed');
        if (refreshBtn) refreshBtn.addEventListener('click', () => loadPosts());
        
        const refreshBadge = document.getElementById('refreshBadge');
        if (refreshBadge) refreshBadge.addEventListener('click', () => loadPosts());
        
        loadPosts();
    });

    window.toggleReplyForm = toggleReplyForm;
    window.sendReply = sendReply;
</script>
</body>
</html>
